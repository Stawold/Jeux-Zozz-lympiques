<style>/* Bubblegame — direction « Affiche olympique » : papier rose, aplats ronds pastel, typo large, prune profond */
/* Layout : colonnes empilées pour téléphone, blocs arrondis, une seule couleur d'action (corail). */
:root {
  --paper: #fff1f5; --paper-2: #ffd6e3; --rose: #ffb6cf; --coral: #e8456b; --coral-d: #b8264b;
  --plum: #2a1638; --plum-2: #4a2b5e; --butter: #ffe08a; --mint: #9ee6cf; --lilac: #c9b8ff;
  --gold: #ffd75e; --silver: #c9d3e3; --bronze: #f4b48a; --ok: #1f9e6e;
  --display: 'Unbounded', 'Arial Black', sans-serif;
  --body: 'Barlow', system-ui, sans-serif;
  /* alias pour le code existant */
  --ink: var(--plum); --ink-2: var(--plum-2); --rose-2: var(--rose); --rose-3: var(--coral);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--body); color: var(--plum); background: var(--paper); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; right: -90px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: var(--rose); z-index: 0; }
body::after { content: ""; position: fixed; right: 40px; top: 150px; width: 76px; height: 76px; border-radius: 50%; background: var(--butter); z-index: 0; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
  padding-block: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-bottom));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }

/* Titres */
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 4vh; position: relative; }
h1.logo { font-family: var(--display); font-weight: 900; font-size: clamp(44px, 14vw, 60px); line-height: .92; letter-spacing: -2px; margin: 0; color: var(--plum); position: relative; }
h1.logo.small { font-size: 40px; }
.sub { margin: -6px 0 6px; font-weight: 600; font-size: 15px; opacity: .8; position: relative; }
h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: -.2px; }

/* Blocs */
.card { position: relative; background: #fff; border-radius: 26px; padding: 16px; }
.card.dark { background: var(--plum); color: var(--paper); }
.blk { position: relative; }
.blkhead { display: flex; justify-content: space-between; align-items: baseline; } .blkhead span { font-weight: 700; font-size: 13px; }
.codecard { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--plum); color: var(--paper); border-radius: 22px; padding: 12px 16px; }
.codecard .lbl { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--rose); }
.code { font-family: var(--display); font-weight: 900; font-size: 30px; letter-spacing: 6px; line-height: 1.1; }
input { width: 100%; font: 600 18px var(--body); padding: 13px 16px; border-radius: 16px; border: 2px solid var(--paper-2); background: var(--paper); color: var(--plum); outline: none; margin-bottom: 10px; }
input:focus-visible { border-color: var(--coral); }
button { font: 800 16px var(--display); letter-spacing: -.2px; border: 0; border-radius: 999px; padding: 14px 18px; min-height: 48px; cursor: pointer;
  color: var(--paper); background: var(--coral); width: 100%; margin-bottom: 0; box-shadow: inset 0 -5px 0 rgba(42,22,56,.2); transition: transform .06s; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
button.alt { background: var(--plum); }
button.ghost { background: #fff; color: var(--plum); box-shadow: inset 0 0 0 2px var(--paper-2); }
button.cta { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; min-height: 58px; }
button.pillbtn { width: auto; background: var(--paper); color: var(--plum); font: 700 14px var(--body); box-shadow: none; }
button:disabled { opacity: .4; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
.muted { opacity: .75; font-size: 14px; text-align: center; }

/* Athlètes en blobs */
.blobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 6px; }
.pblob { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.pblob .pn { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blob { position: relative; display: block; width: 50px; height: 45px; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; }
.blob::before, .blob::after { content: ""; position: absolute; top: 17px; width: 7px; height: 9px; border-radius: 50%; background: var(--plum); }
.blob::before { left: 14px; } .blob::after { right: 14px; }
.blob.add { border: 2px dashed var(--plum); display: flex; align-items: center; justify-content: center; font: 800 18px var(--display); }
.blob.add::before, .blob.add::after { display: none; }
.pblob.me .blob { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--coral); }
.pblob.off { opacity: .35; }

/* Listes de joueurs (classements) */
.players { display: flex; flex-direction: column; gap: 6px; }
.pl { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 16px; background: #fff; font-weight: 700; }
.pl .dot { width: 22px; height: 20px; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; flex: none; }
.pl .flag { font-size: 20px; } .pl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .pts { font: 800 14px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl.me { background: var(--coral); color: var(--paper); } .pl.off { opacity: .4; }
.card.dark .pl { color: var(--plum); } .card.dark .pl.me { color: var(--paper); }
.flags { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.flags button { font-size: 21px; padding: 6px 0; min-height: 40px; border-radius: 12px; background: #fff; box-shadow: none; }
.flags button.sel { background: var(--plum); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { width: auto; flex: 1 1 30%; font: 700 13px var(--body); padding: 8px 6px; min-height: 40px; background: #fff; color: var(--plum); box-shadow: none; }
.chips button.sel { background: var(--plum); color: var(--paper); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; height: 70px; padding: 9px 10px; border-radius: 16px; color: var(--plum); box-shadow: none; text-align: left; }
.tile b { font: 900 22px var(--display); line-height: 1; } .tile span { font: 700 11px var(--body); letter-spacing: .5px; text-transform: uppercase; }
.tile.t0 { background: var(--rose); } .tile.t1 { background: var(--butter); } .tile.t2 { background: var(--mint); } .tile.t3 { background: var(--lilac); } .tile.t4 { background: #fff; }
.tile.wide { grid-column: span 2; }
.tile.sel { background: var(--plum); color: var(--paper); }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 9; background: var(--plum); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; }
#toast.on { opacity: 1; }

/* Jeu */
.game { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px; background: var(--paper);
  padding-block: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-bottom));
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.title { align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--plum); }
.record { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--butter); color: var(--plum); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
.record .wr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .record .pb { white-space: nowrap; opacity: .75; }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--plum); color: var(--paper); border-radius: 16px; padding: 6px 14px;
  font: 800 16px var(--display); font-variant-numeric: tabular-nums; }
.hud .big { font-size: 22px; color: var(--rose); }
.cd { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; font: 900 120px var(--display); color: var(--paper); letter-spacing: -4px; }
.cd::before { content: ""; position: absolute; width: 230px; height: 230px; border-radius: 50%; background: var(--coral); z-index: -1; animation: cdpop .8s ease-out infinite; }
@keyframes cdpop { from { transform: scale(1.25); } to { transform: scale(1); } }
.help { background: #fff; border-radius: 14px; padding: 8px 12px; text-align: center; font-weight: 600; font-size: 14px; }
.tapzone { margin: auto 0 0; width: 100%; height: 30vh; max-height: 240px; border-radius: 36px; font: 900 56px var(--display); letter-spacing: -2px;
  background: var(--coral); box-shadow: inset 0 -12px 0 rgba(42,22,56,.25); position: relative; overflow: hidden; }
.tapzone::before { content: ""; position: absolute; left: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.18); }
.tapzone:active { transform: scale(.98); }
.arena { position: relative; flex: 1; min-height: 0; border-radius: 26px; background: var(--paper-2); overflow: hidden; touch-action: none; }
.bubble { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
  background: radial-gradient(circle, var(--paper) 0 18%, var(--c, #e8456b) 19% 38%, var(--paper) 39% 58%, var(--c, #e8456b) 59%); animation: pop-in .15s ease-out; }
@keyframes pop-in { from { transform: scale(.2); } }
.burst { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 5px solid var(--coral); animation: burst .3s forwards; pointer-events: none; }
@keyframes burst { to { transform: scale(1.8); opacity: 0; } }
.gauge { position: relative; height: 54px; border-radius: 999px; background: #fff; overflow: hidden; margin: 6px 0; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: var(--mint); }
.gauge .foul { position: absolute; top: 0; bottom: 0; left: 80%; right: 0; background: var(--coral); }
.gauge .arrow { position: absolute; top: 6px; bottom: 6px; width: 8px; margin-left: -4px; background: var(--plum); border-radius: 4px; }
.tries { display: flex; justify-content: center; gap: 10px; font-size: 26px; }
canvas.full { width: 100%; flex: 1; min-height: 0; border-radius: 26px; touch-action: none; display: block; }
.pads { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.pads button { height: 70px; font-size: 30px; border-radius: 22px; }
.pads button:nth-child(2), .pads button:nth-child(3) { background: var(--plum); }
.wait { position: fixed; z-index: 6; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--plum); color: var(--paper); }
.newrec { font: 900 20px var(--display); color: var(--butter); text-align: center; animation: cdpop .6s ease-out; }
.medal { font-size: 22px; width: 32px; text-align: center; }

/* Écran partagé */
.split-top { flex: 1 1 46%; min-height: 0; display: flex; }
.split-top canvas { width: 100%; height: 100%; border-radius: 26px; display: block; }
.split-bot { flex: 1 1 54%; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.split-bot .arena { flex: 1; }
.rank-row { display: flex; align-items: stretch; gap: 10px; min-height: 0; }
.pos { min-width: 108px; border-radius: 22px; background: var(--plum); color: var(--paper); display: flex; align-items: center; justify-content: center; padding: 6px 4px;
  font: 900 60px/0.95 var(--display); letter-spacing: -3px; }
.pos sup { font-size: 22px; letter-spacing: 0; vertical-align: top; position: relative; top: 6px; }
.pos.p1 { color: var(--gold); } .pos.p2 { color: var(--silver); } .pos.p3 { color: var(--bronze); }
.pos.bump { animation: bump .35s ease-out; } @keyframes bump { 40% { transform: scale(1.12); } }
.mini { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.mini div { display: flex; align-items: center; gap: 6px; background: #fff; color: var(--plum); font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; }
.mini div.me { background: var(--coral); color: var(--paper); } .mini b { font: 800 12px var(--display); width: 18px; } .mini span.n { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.split-bot .tapzone { height: auto; flex: 1; min-height: 120px; max-height: 260px; white-space: nowrap; }
.ctl { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; }
.curl-start { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 14px; font: 800 13px var(--display); }
.curl-start input { margin: 0; padding: 0; border: 0; background: none; accent-color: var(--coral); flex: 1; }

/* Podiums et résultats */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; min-height: 220px; margin: 6px 0; }
.podium .step { flex: 1; max-width: 120px; text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 6px; }
.podium .block { border-radius: 20px 20px 0 0; color: var(--plum); font: 900 34px var(--display); display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
.podium .who { font-size: 13px; line-height: 1.2; } .podium .fl { font-size: 30px; }
.rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-weight: 600; font-size: 15px; line-height: 1.4; }
.rd { font-size: 22px; text-align: center; opacity: .25; filter: grayscale(1); } .rd.ok { opacity: 1; filter: none; }
.move { font: 800 12px var(--display); width: 26px; text-align: center; } .move.up { color: var(--ok); } .move.down { color: var(--coral-d); }
.pl.me .move { color: var(--paper); }

/* Contrôles spécifiques */
.phase { text-align: center; font: 900 20px var(--display); color: var(--paper); background: var(--plum-2); padding: 10px 12px; border-radius: 18px; flex-shrink: 0; }
.phase.ph-run { background: var(--coral); } .phase.ph-jump { background: var(--ok); } .phase.ph-wait { background: var(--plum-2); }
.runbar { height: 14px; border-radius: 999px; background: #fff; overflow: hidden; flex-shrink: 0; }
.runbar i { display: block; height: 100%; width: 100%; background: var(--coral); transform-origin: left; }
.split-bot > .gauge, .split-bot > .help, .split-bot > .hud { flex-shrink: 0; }
.tapzone.jumpbtn { background: var(--ok); }
.tapzone.locked { background: #d9d2df; color: var(--plum); font-size: 44px; }
.duo { display: flex; align-items: stretch; gap: 10px; flex: 1; min-height: 120px; }
.duo .tapzone { margin: 0; flex: 2; height: auto; max-height: none; }
.jump { flex: 1; width: auto; height: auto; border-radius: 36px; margin: 0; background: var(--mint); color: var(--plum); font: 900 20px var(--display); }
.jump.callout { background: var(--butter); animation: callout .5s ease-in-out infinite alternate; }
@keyframes callout { to { transform: scale(1.06); } }
.wheel { position: relative; margin: auto auto 0; width: min(64vw, 30vh); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: #fff; touch-action: none;
  display: flex; align-items: center; justify-content: center; font: 800 13px var(--display); color: var(--plum); box-shadow: inset 0 0 0 10px var(--plum); }
.wheel span { position: relative; background: var(--paper); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.spokes { position: absolute; inset: 10%; border-radius: 50%; pointer-events: none; background: repeating-conic-gradient(var(--coral) 0 5deg, transparent 5deg 30deg); }
.segbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.segbar span { text-align: center; font: 800 11px var(--display); background: #fff; padding: 6px 0; border-radius: 999px; opacity: .5; }
.segbar span.on { background: var(--mint); opacity: 1; }
.swimzone, .rowzone { flex: 1; min-height: 120px; border-radius: 26px; touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center;
  background: repeating-linear-gradient(180deg, #a9e3f7 0 16px, #95d8f0 16px 32px); font: 900 18px var(--display); color: var(--plum); padding: 10px; position: relative; overflow: hidden; }
.swimzone b, .rowzone b { background: var(--paper); padding: 6px 14px; border-radius: 999px; position: relative; pointer-events: none; }
.rowzone { background: repeating-linear-gradient(180deg, #8fcdee 0 16px, #7cc0e6 16px 32px); }
.oar { position: absolute; top: 10%; bottom: 10%; width: 12px; background: var(--paper); border-radius: 6px; }
.oar.l { left: 18%; transform: rotate(-12deg); } .oar.r { right: 18%; transform: rotate(12deg); }
.rowzone.pull .oar.l { animation: pullL .35s ease-out; } .rowzone.pull .oar.r { animation: pullR .35s ease-out; }
@keyframes pullL { 50% { transform: rotate(25deg); } } @keyframes pullR { 50% { transform: rotate(-25deg); } }
.seq { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.seq span { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #fff; border-radius: 12px; }
.seq span.show { background: var(--butter); transform: scale(1.12); } .seq span.seen { background: #fff3c4; } .seq span.ok { background: var(--mint); } .seq span.ko { background: var(--rose); }
.grid9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; min-height: 0; }
.grid9 button { height: auto; min-height: 44px; border-radius: 16px; background: #fff; color: var(--plum); font-size: 22px; box-shadow: none; }
.grid9 button.prev { background: var(--paper-2); }
.zones { display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: flex-end; }
button.picked { background: var(--butter) !important; color: var(--plum) !important; }
button.goal { background: var(--mint) !important; } button.saved { background: var(--rose) !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* La scène 3D ne sert qu'au podium final ; ailleurs, l'affiche reste nette */
#bg { display: none; }
body[data-phase="final"] #bg { display: block; }
body[data-phase="final"]::before, body[data-phase="final"]::after { display: none; }

/* Classement live : hauteur fixe pour que rien ne bouge en dessous */
.rank-row { height: 150px; flex-shrink: 0; }
.mini { overflow: hidden; } .mini div { flex: 0 0 24px; padding-block: 0; }
.pos { width: 108px; flex: none; }
/* Médailles */
.medline { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.md { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; font: 800 11px var(--display); font-style: normal; color: var(--plum); }

.medtab th .md { min-width: 16px; height: 16px; }

#bg { pointer-events: none; }

/* Logo « Les Jeux Zozz’lympiques » */
h1.logo .l1 { display: block; font-size: .62em; letter-spacing: -1px; }

  hauteur: { name: 'Saut en hauteur', type: 'solo' },
  longueur: { name: 'Saut en longueur', type: 'solo' },
  tir: { name: 'Tir de vitesse', type: 'solo' },
  curling: { name: 'Curling', type: 'duel' },
  football: { name: 'Football', type: 'duel' },
  skate: { name: 'Skateboard', type: 'solo' },
  basket: { name: 'Basketball', type: 'solo' },
  handball: { name: 'Handball', type: 'duel' },
  rugby: { name: 'Rugby', type: 'solo' },
  escrime: { name: 'Escrime', type: 'duel' },
  golf: { name: 'Mini-golf', type: 'solo' },
  haltero: { name: 'Haltérophilie', type: 'solo' },
  arc: { name: "Tir à l'arc", type: 'solo' },
  ski: { name: 'Ski slalom', type: 'solo' },
  marteau: { name: 'Lancer du marteau', type: 'solo' },
  escalade: { name: 'Escalade', type: 'solo' },
  judo: { name: 'Judo', type: 'duel' },
  hiphop: { name: 'Hip-Hop', type: 'solo' },
};
  const MODES = { libre: { name: 'Jeu libre', count: 1 }, penta: { name: 'Pentathlon', count: 5 }, hepta: { name: 'Heptathlon', count: 7 }, deca: { name: 'Décathlon', count: 10 }, jo: { name: 'Mode J.O.', count: Infinity } };
  const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];
  const BOT_NAMES = ['Gloop', 'Bloby', 'Squishy', 'Gommo', 'Bulle', 'Pâtou', 'Slimo', 'Jello', 'Mochi', 'Fizz', 'Wobble', 'Chewie', 'Pop', 'Glu', 'Flubb'];
  const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  let room = null, timers = [];
  const clearT = () => { timers.forEach(clearTimeout); timers.forEach(clearInterval); timers = []; };

  const pub = () => ({
    code: 'BOTS', hostId: room.hostId, phase: room.phase, mode: room.mode,
    players: [...room.players.values()].map((p) => ({ id: p.id, name: p.name, country: p.country, total: p.total, medals: p.medals || [0, 0, 0], connected: true })),
    program: room.program, index: room.index, current: room.current ? { ...room.current, ready: [...(room.ready || [])] } : null, done: Object.keys(room.results), reveal: room.reveal,
    countries: COUNTRIES, events: EVENTS, modes: MODES,
  });
  const emit = () => send('state', pub());

  const t2 = (t) => ({ score: -Math.round(t * 100) / 100, detail: t.toFixed(2) + ' s' });
  function botResult(ev) {
    const race = { sprint: [8.5, 15], haies: [11, 20], cyclisme: [8, 16], natation: [26, 45], aviron: [14, 26], tir: [9, 18], escalade: [6.5, 12], ski: [18, 30] }[ev];
    if (race) { const t = rnd(...race); return { delay: t * 1000 + 2600, t, ...t2(t) }; }
    switch (ev) {
      case 'hauteur': { const k = Math.floor(rnd(0, 9)), f = Math.floor(rnd(3, 6)); const h = k ? 150 + (k - 1) * 10 : 0; return { delay: rnd(8, 25) * 1000, score: h * 100 - f, detail: h ? (h / 100).toFixed(2).replace('.', ',') + ' m' : '0 m' }; }
      case 'longueur': { const cm = Math.round(rnd(560, 880)); return { delay: rnd(14, 20) * 1000, score: cm, detail: (cm / 100).toFixed(2).replace('.', ',') + ' m' }; }
      case 'hiphop': { const s = Math.floor(rnd(60, 260)); return { delay: 62600, score: s, detail: s + ' pts' }; }
      case 'skate': { const n = Math.floor(rnd(1, 7)), s = n * 100 + Math.floor(rnd(0, n * 30)); return { delay: rnd(40, 70) * 1000, score: s, detail: s + ' pts' }; }
      case 'basket': case 'rugby': { const n = Math.floor(rnd(1, 6)); return { delay: rnd(14, 24) * 1000, score: n, detail: n + '/5' }; }
      case 'haltero': { const kg = 100 + 10 * Math.floor(rnd(0, 11)); return { delay: rnd(25, 60) * 1000, score: kg * 100 - Math.floor(rnd(3, 6)), detail: kg + ' kg' }; }
      case 'arc': { const s = Math.floor(rnd(40, 85)); return { delay: rnd(30, 50) * 1000, score: s, detail: s + ' pts' }; }
      case 'marteau': { const cm = Math.round(rnd(5200, 8500)); return { delay: rnd(15, 25) * 1000, score: cm, detail: (cm / 100).toFixed(2).replace('.', ',') + ' m' }; }

    const later = [];

    const bots = [...room.players.values()].filter((p) => p.bot);

      pairs = [{ a: room.hostId, b: 'BOT', first: Math.random() < 0.5 ? room.hostId : 'BOT' }];
      const ids = shuffle(bots.map((b) => b.id));

        const a = ids[i], b = ids[i + 1] || 'BOT';

        const aw = Math.random() < 0.5;
        const pts = 1 + Math.floor(Math.random() * 3);
        setT(() => {
          result(a, aw ? 1 : 0, aw ? `${pts}-0` : `0-${pts}`);
          if (b !== 'BOT') result(b, aw ? 0 : 1, aw ? `0-${pts}` : `${pts}-0`);
        }, rnd(15, 40) * 1000);
      }
    } else {
      for (const b of bots) {
        const r = botResult(ev);
        if (r.t) { // progression visible au 100 m / tir
          setT(() => {
            const st = performance.now() + 2600;
            const iv = setInterval(() => { const v = Math.min(1, Math.max(0, (performance.now() - st) / 1000 / r.t)); send('prog', { id: b.id, v }); if (v >= 1) clearInterval(iv); }, 120);
            timers.push(iv);
          }, 0);
        }
        setT(() => result(b.id, r.score, r.detail), r.delay);
      }
    }
    room.current = { id: (room.current?.id || 0) + 1, event: ev, seed: Math.floor(Math.random() * 1e9), pairs, index: room.index, count: room.program.length, go: false };
    room.reveal = null;
    room.later = later;
    // les bots lisent les règles en 1 à 3 s
    for (const b of bots) timers.push(setTimeout(() => ready(b.id), rnd(1000, 3000)));
    emit();
  }
  function ready(id) {
    if (!room || room.phase !== 'event' || room.current.go) return;
    room.ready.add(id);
    if ([...room.players.keys()].every((k) => room.ready.has(k))) {
      room.current.go = true;
      for (const [f, ms] of room.later) timers.push(setTimeout(f, ms));
    }
    emit();
  }
  function result(id, score, detail) {
    if (!room || room.phase !== 'event' || room.results[id] !== undefined) return;
    room.results[id] = score; room.details[id] = detail;
    emit();
    if ([...room.players.keys()].every((k) => room.results[k] !== undefined)) finish();
  }
  function finish() {
    const ev = EVENTS[room.current.event];
    const all = [...room.players.values()].sort((a, b) => room.results[b.id] - room.results[a.id]);
    const ranking = [];
    if (ev.type === 'duel') for (const p of all) { const w = room.results[p.id] > 0; ranking.push({ id: p.id, score: room.results[p.id], detail: room.details[p.id], pts: w ? 10 : 8, rank: w ? 1 : 2 }); }
    else {
      let ps = null, pr = 0;
      all.forEach((p, i) => { const s = room.results[p.id]; const r = i > 0 && s === ps ? pr : i; ps = s; pr = r; ranking.push({ id: p.id, score: s, detail: room.details[p.id], pts: POINTS[r] || 0, rank: r + 1 }); });
    }
    for (const r of ranking) { const pl = room.players.get(r.id); pl.total += r.pts; pl.medals = pl.medals || [0, 0, 0]; if (ev.type !== 'duel' && r.rank >= 1 && r.rank <= 3) pl.medals[r.rank - 1]++; }

    room.phase = 'reveal';
    emit();
  }

  function srv(e, d) {
    if (e === 'create') {
      const n = Math.max(1, Math.min(15, d.bots || 7));
      room = { hostId: d.pid, phase: 'lobby', mode: null, players: new Map(), program: [], index: 0, current: null, results: {}, reveal: null };
      room.players.set(d.pid, { id: d.pid, name: String(d.name || 'Joueur').slice(0, 16), country: 'FR', total: 0 });
      const names = shuffle(BOT_NAMES);
      const cs = COUNTRIES.filter((c) => c.code !== 'FR');
      for (let i = 0; i < n; i++) room.players.set('bot' + i, { id: 'bot' + i, bot: true, name: '🤖 ' + names[i], country: cs[i].code, total: 0 });
      return emit();
    }
    if (e === 'join') return send('err', { msg: 'Hors-ligne : crée une partie contre des bots', silent: true });
    if (!room) return;
    const me = room.players.get(room.hostId);
    if (e === 'country') {
      if ([...room.players.values()].some((p) => p.country === d.code && p.id !== me.id)) {
        const other = [...room.players.values()].find((p) => p.country === d.code);
        other.country = me.country; // échange avec le bot
      }
      me.country = d.code; return emit();
    }
    if (e === 'start') {
      if (room.phase === 'final') for (const p of room.players.values()) { p.total = 0; p.medals = [0, 0, 0]; }
      const all = Object.keys(EVENTS);
      room.program = d.mode === 'libre' ? [d.event] : shuffle(all).slice(0, Math.min(MODES[d.mode].count, all.length));
      room.mode = d.mode; room.index = 0;
      return startEvent();
    }
    if (e === 'ready') return ready(room.hostId);
    if (e === 'result') return result(room.hostId, d.score, d.detail);
    if (e === 'next') { room.index++; if (room.index < room.program.length) startEvent(); else { room.phase = 'final'; emit(); } return; }
    if (e === 'podium') { room.phase = 'final'; return emit(); }
    if (e === 'toLobby') { clearT(); if (room.phase === 'final') for (const p of room.players.values()) { p.total = 0; p.medals = [0, 0, 0]; } room.phase = 'lobby'; room.reveal = null; return emit(); }
    if (e === 'leave') { clearT(); room = null; }
  }
  return sock;
};

<script type="module">
// Jeux Zozz’lympiques — outils partagés par les épreuves
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (root, sel) => root.querySelector(sel);

async function countdown(root) {
  const el = document.createElement('div');
  el.className = 'cd';
  root.appendChild(el);
  for (const t of ['3', '2', '1', 'GO !']) {
    el.textContent = t;
    if (t === 'GO !') { sfx('gun'); buzz(80); } else { sfx('beep'); buzz(30); }
    await sleep(t === 'GO !' ? 450 : 800);
  }
  el.remove();
}

function fitCanvas(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W: r.width, H: r.height };
}

/* ---------- Classement live façon course (écran partagé) ---------- */
function liveStandings(ctx, posEl, miniEl) {
  const fin = {}; // id -> instant d'arrivée
  let lastPos = 0;
  function update() {
    const now = performance.now();
    for (const p of ctx.players) if ((ctx.progs[p.id] || 0) >= 1 && !fin[p.id]) fin[p.id] = now;
    const list = [...ctx.players].sort((a, b) => {
      const fa = fin[a.id], fb = fin[b.id];
      if (fa && fb) return fa - fb; if (fa) return -1; if (fb) return 1;
      return (ctx.progs[b.id] || 0) - (ctx.progs[a.id] || 0);
    });
    const pos = list.findIndex((p) => p.id === ctx.me) + 1;
    if (pos !== lastPos) {
      posEl.innerHTML = `${pos}<sup>${pos === 1 ? 'er' : 'e'}</sup>`;
      posEl.className = 'pos bump ' + (pos <= 3 ? 'p' + pos : '');
      lastPos = pos;
    }
    const meIdx = pos - 1;
    const show = list.map((p, i) => ({ p, i })).filter(({ i }) => i < 4 || i === meIdx).slice(0, 5);
    // toujours 5 lignes : la hauteur ne bouge jamais quand le classement change
    const rows = show.map(({ p, i }) => `<div class="${p.id === ctx.me ? 'me' : ''}"><b>${i + 1}</b><span>${p.flag}</span><span class="n">${p.name}</span></div>`);
    while (rows.length < 5) rows.push('<div style="visibility:hidden"><b>0</b><span class="n">-</span></div>');
    const html = rows.join('');
    if (miniEl.innerHTML !== html) miniEl.innerHTML = html;
    return list;
  }
  return { update };
}

// Petit slime d'athlète vu de face (canvas 2D)
function slime(g, cx, cy, r, color, band = '#e8456b') {
  g.lineWidth = 2; g.strokeStyle = '#2a1638';
  g.fillStyle = 'rgba(31,33,64,.2)'; g.beginPath(); g.ellipse(cx, cy + r * 0.9, r, r * 0.25, 0, 0, 7); g.fill();
  g.fillStyle = color; g.beginPath(); g.ellipse(cx, cy, r, r * 0.9, 0, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.fillRect(cx - r, cy - r * 0.6, r * 2, r * 0.28);
  g.fillStyle = band; g.fillRect(cx - r, cy - r * 0.52, r * 2, r * 0.1);
  for (const s of [-1, 1]) {
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cx + s * r * 0.35, cy - r * 0.05, r * 0.2, 0, 7); g.fill();
    g.fillStyle = '#2a1638'; g.beginPath(); g.arc(cx + s * r * 0.35, cy - r * 0.02, r * 0.1, 0, 7); g.fill();
  }
}
// Fond de stade commun aux vues en canvas
function stands(g, W, h) {
  g.fillStyle = '#ffd6e3'; g.fillRect(0, 0, W, h);
  const cols = ['#e8456b', '#ffd75e', '#9ee6cf', '#c9b8ff'];
  for (let i = 0, x = 4; x < W; i++, x += 9) { g.fillStyle = cols[i % 4]; g.beginPath(); g.arc(x, h / 2 + ((i % 2) - 0.5) * 3, 2.5, 0, 7); g.fill(); }
}

function tone(f, d, type = 'sine', v = 0.25, slide = 0, delay = 0) {
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();

function noise(d, v = 0.3, freq = 1200, delay = 0, q = 0.7, attack = 0.005) {

    switch (name) {
      case 'beep': tone(660, 0.15, 'square', 0.12); break;
      case 'gun': noise(0.35, 0.8, 900, 0, 0.5); tone(120, 0.2, 'sawtooth', 0.15, -60); break;
      case 'pop': tone(500 + Math.random() * 300, 0.09, 'sine', 0.3, 500); break;
      case 'tick': tone(1200, 0.04, 'square', 0.06); break;
      case 'ok': tone(660, 0.1, 'triangle', 0.2); tone(990, 0.16, 'triangle', 0.2, 0, 0.09); break;
      case 'fail': tone(220, 0.3, 'sawtooth', 0.12, -90); break;
      case 'whistle': tone(2100, 0.35, 'sine', 0.15, 80); tone(2150, 0.35, 'sine', 0.08); break;
      case 'thud': tone(90, 0.25, 'sine', 0.5, -40); noise(0.12, 0.3, 300); break;
      case 'crowd': noise(1.6, 0.25, 700, 0, 0.4, 0.4); noise(1.4, 0.15, 1500, 0.1, 0.6, 0.5); break;
      case 'fanfare': [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.16, 'triangle', 0.2, 0, i * 0.14)); break;

}

/* ---------- Inclinaison du téléphone (avec repli au doigt) ---------- */
// À appeler dans un geste utilisateur (bouton « Prêt ») pour iOS.
async function requestSensors() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') await DeviceOrientationEvent.requestPermission();
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') await DeviceMotionEvent.requestPermission();

}

// Le doigt glissé sur `dragEl` prend le relais si le téléphone ne fournit pas de capteurs.
function tilt(dragEl, range = 30) {
  let zero = null, gamma = null, lastSensor = 0, drag = 0, dragging = false, shakeV = 0, last = null;
  const onOri = (e) => { if (e.gamma == null) return; if (zero === null) zero = e.gamma; gamma = e.gamma - zero; lastSensor = performance.now(); };
  const onMot = (e) => { const a = e.accelerationIncludingGravity; if (!a || a.x == null) return; if (last) shakeV = shakeV * 0.85 + (Math.abs(a.x - last.x) + Math.abs(a.y - last.y) + Math.abs(a.z - last.z)) * 0.15; last = { x: a.x, y: a.y, z: a.z }; };

    dragEl.addEventListener('pointerup', () => { dragging = false; });

    get sensor() { return performance.now() - lastSensor < 600; },
    value() { if (dragging || !this.sensor) return drag; return Math.max(-1, Math.min(1, gamma / range)); },
    shake() { return this.sensor ? Math.min(1, shakeV / 3) : 0; },
    recalibrate() { zero = null; },
    stop() { removeEventListener('deviceorientation', onOri); removeEventListener('devicemotion', onMot); },
  };
}

/* ---------------- Tir de vitesse (écran partagé) ---------------- */
async function tir(root, ctx) {
  const TOTAL = 20;
  root.innerHTML = `
    <div class="hud"><span class="big" id="n">0 / ${TOTAL}</span><span id="t">0.00 s</span></div>
    <div class="rank-row"><div class="pos p1" id="pos">1<sup>er</sup></div><div class="mini" id="mini"></div></div>
    <div class="arena" id="ar"></div>
    <div class="help">Éclate les cibles ! Tir à côté = +0,5 s</div>`;
