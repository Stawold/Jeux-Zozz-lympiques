      <div class="grid9" id="g9">${Array.from({ length: 9 }, (_, i) => `<button data-v="${i}" disabled></button>`).join('')}</div>
    </div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), scEl = $(root, '#sc'), tm = $(root, '#tm');
  const btns = [...root.querySelectorAll('#g9 button')];
  const { g, W, H } = fitCanvas(cv);
  let me = 0, opp = 0, anim = null, role = 'shoot';
  const used = { me: new Set(), opp: new Set() };
  const goal = () => ({ x: W * 0.12, y: H * 0.18, w: W * 0.76, h: H * 0.58 });
  const cell = (i) => { const G = goal(); return { x: G.x + (i % 3 + 0.5) * G.w / 3, y: G.y + (Math.floor(i / 3) + 0.5) * G.h / 3 }; };
  function draw(t) {
    if (!root.isConnected) return;
    g.fillStyle = '#fff1f5'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    g.fillStyle = '#e9b98a'; g.fillRect(0, H * 0.76, W, H * 0.24);
    const G = goal();
    g.strokeStyle = 'rgba(31,33,64,.25)'; g.lineWidth = 1;
    for (let x = G.x; x <= G.x + G.w; x += 10) { g.beginPath(); g.moveTo(x, G.y); g.lineTo(x, G.y + G.h); g.stroke(); }
    for (let y = G.y; y <= G.y + G.h; y += 10) { g.beginPath(); g.moveTo(G.x, y); g.lineTo(G.x + G.w, y); g.stroke(); }
    g.lineWidth = 8; for (let k = 0; k < 10; k++) { g.strokeStyle = k % 2 ? '#e8456b' : '#fff'; g.beginPath(); g.moveTo(G.x, G.y + G.h - k * G.h / 10); g.lineTo(G.x, G.y + G.h - (k + 1) * G.h / 10); g.moveTo(G.x + G.w, G.y + G.h - k * G.h / 10); g.lineTo(G.x + G.w, G.y + G.h - (k + 1) * G.h / 10); g.stroke(); }
    g.beginPath(); for (let k = 0; k < 10; k++) { g.strokeStyle = k % 2 ? '#e8456b' : '#fff'; g.beginPath(); g.moveTo(G.x + k * G.w / 10, G.y); g.lineTo(G.x + (k + 1) * G.w / 10, G.y); g.stroke(); }
    const keeperCol = role === 'shoot' ? D.oppCol : D.myCol;
    let kx = W / 2, ky = G.y + G.h * 0.62, bx = W / 2, by = H * 0.92, br = 9;
    if (anim) {
      const k = Math.min(1, (t - anim.t0) / 600);
      const kc = cell(anim.keep), bc = cell(anim.shot);
      kx += (kc.x - kx) * k; ky += (kc.y - ky) * k;
      bx += (bc.x - bx) * k; by += (bc.y - by) * k; br = 9 - k * 3;
    }
    slime(g, kx, ky, Math.min(W, H) * 0.09, keeperCol, '#9ee6cf');
    g.fillStyle = '#ffd75e'; g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill(); g.stroke();
    if (anim && anim.label) { g.font = '900 27px Unbounded, sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.strokeStyle = '#2a1638'; g.lineWidth = 5; g.strokeText(anim.label, W / 2, H * 0.12 + 20); g.fillText(anim.label, W / 2, H * 0.12 + 20); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  D.onForfeit = () => {};
  await countdown(root);
  let r = 0;
  while (!D.forfeit) {
    const iShoot = (r % 2 === 0) === D.firstIsMe;
    role = iShoot ? 'shoot' : 'keep';
    const mineUsed = iShoot ? used.me : null;
    if (mineUsed && mineUsed.size >= 9) mineUsed.clear();
    if (used.opp.size >= 9) used.opp.clear();
    const allowed = iShoot ? [...Array(9).keys()].filter((i) => !used.me.has(i)) : [...Array(9).keys()];
    btns.forEach((b, i) => { const done = iShoot ? used.me.has(i) : used.opp.has(i); b.textContent = done ? (iShoot ? '✖' : '⚽') : ''; b.className = done && !iShoot ? 'prev' : ''; });
    msg.textContent = iShoot ? `🎯 Tir ${Math.floor(r / 2) + 1} : choisis où tirer (✖ = déjà utilisé)` : `🧤 Gardien : choisis où plonger (⚽ = déjà tiré par ${D.oppName}, il ne peut plus y tirer)`;
    const [mine, theirs] = await simultaneousPick(ctx, D, r, btns, allowed, tm, () => {
      if (iShoot) return Math.floor(Math.random() * 9);
      const free = [...Array(9).keys()].filter((i) => !used.opp.has(i)); return free[Math.floor(Math.random() * free.length)];
    });
    if (D.forfeit) break;
    const shot = iShoot ? mine : theirs, keep = iShoot ? theirs : mine;
    (iShoot ? used.me : used.opp).add(shot);
    const goalScored = shot !== keep;
    if (goalScored) { if (iShoot) me++; else opp++; }
    anim = { t0: performance.now(), shot, keep, label: '' };
    await sleep(650);
    anim.label = goalScored ? 'BUT !' : 'ARRÊT !'; sfx(goalScored === iShoot ? 'ok' : 'fail');
    btns[shot].className = goalScored ? 'goal' : 'saved';
    scEl.textContent = `${me} – ${opp}`;
    await sleep(1100); anim = null;
    r++;
    // 5 tirs chacun, puis mort subite par paire de tirs
    if (r >= 10 && r % 2 === 0 && me !== opp) break;
  }
  const win = D.forfeit || me > opp;
  msg.textContent = D.forfeit ? '🏆 Victoire par forfait' : win ? '🏆 Victoire !' : '😢 Défaite';
  ctx.finish(win ? 1 : 0, D.forfeit ? 'forfait' : `${me}-${opp}`);
}

/* ---------------- Escrime : attaque / parade ---------------- */
async function escrime(root, ctx) {
  const D = duel(ctx);
  const Z = ['⬆️ Haut', '⏺ Milieu', '⬇️ Bas'];
  root.innerHTML = `
    <div class="hud"><span class="big" id="sc">0 – 0</span><span>vs ${D.oppName}</span><span id="tm"></span></div>
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="help" id="msg"></div>
      <div class="zones" id="zs">${Z.map((z, i) => `<button data-v="${i}" disabled>${z}</button>`).join('')}</div>
    </div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), scEl = $(root, '#sc'), tm = $(root, '#tm');
  const btns = [...root.querySelectorAll('#zs button')];
  const { g, W, H } = fitCanvas(cv);
  let me = 0, opp = 0, attMe = D.firstIsMe, anim = null;
  function fencer(x, y, r, col, dir, lunge, zone) {
    slime(g, x, y, r, col, '#fff');
    g.fillStyle = 'rgba(31,33,64,.75)'; g.beginPath(); g.ellipse(x + dir * r * 0.15, y - r * 0.05, r * 0.75, r * 0.6, 0, 0, 7); g.fill(); // masque
    g.strokeStyle = '#c9d3e3'; g.lineWidth = 1; for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(x + dir * r * 0.15 + k * r * 0.18, y - r * 0.6); g.lineTo(x + dir * r * 0.15 + k * r * 0.18, y + r * 0.5); g.stroke(); }
    const zy = [y - r * 0.9, y, y + r * 0.7][zone ?? 1];
    g.strokeStyle = '#2a1638'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + dir * r, y + r * 0.2); g.lineTo(x + dir * (r + r * 1.6 + lunge), zy); g.stroke();
  }
  function draw(t) {
    if (!root.isConnected) return;
    g.fillStyle = '#fff1f5'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    g.fillStyle = '#c9d3e3'; g.fillRect(0, H * 0.72, W, H * 0.12); g.fillStyle = '#fff'; g.fillRect(W / 2 - 1, H * 0.72, 2, H * 0.12);
    const r = Math.min(W, H) * 0.12, y = H * 0.56;
    let lm = 0, lo = 0, zm = 1, zo = 1;
    if (anim) { const k = Math.min(1, (t - anim.t0) / 450); const L = Math.sin(k * Math.PI) * r * 0.9; if (anim.attMe) { lm = L; zm = anim.att; zo = anim.def; } else { lo = L; zo = anim.att; zm = anim.def; } }
    fencer(W * 0.28, y, r, D.myCol, 1, lm, zm);
    fencer(W * 0.72, y, r, D.oppCol, -1, lo, zo);
    g.font = '900 12px Unbounded, sans-serif'; g.textAlign = 'center'; g.fillStyle = '#2a1638';
    g.fillText('TOI', W * 0.28, y + r * 1.45); g.fillText(D.oppName, W * 0.72, y + r * 1.45);
    for (let i = 0; i < 3; i++) { g.fillStyle = i < me ? '#2ec48f' : '#fff'; g.beginPath(); g.arc(W * 0.12 + i * 18, 30, 6, 0, 7); g.fill(); g.stroke(); g.fillStyle = i < opp ? '#e63946' : '#fff'; g.beginPath(); g.arc(W * 0.88 - i * 18, 30, 6, 0, 7); g.fill(); g.stroke(); }
    if (anim && anim.label) { g.font = '900 27px Unbounded, sans-serif'; g.fillStyle = '#fff'; g.strokeStyle = '#2a1638'; g.lineWidth = 5; g.strokeText(anim.label, W / 2, H * 0.3); g.fillText(anim.label, W / 2, H * 0.3); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  let r = 0;
  while (!D.forfeit && me < 3 && opp < 3) {
    msg.textContent = attMe ? '⚔️ Tu attaques : choisis ta zone' : '🛡 Tu défends : devine la zone de parade';
    const [mine, theirs] = await simultaneousPick(ctx, D, r, btns, [0, 1, 2], tm, () => Math.floor(Math.random() * 3));
    if (D.forfeit) break;
    const att = attMe ? mine : theirs, def = attMe ? theirs : mine;
    anim = { t0: performance.now(), attMe, att, def, label: '' };
    await sleep(450);
    if (att === def) { anim.label = 'PARADE !'; sfx('thud'); attMe = !attMe; }
    else { anim.label = 'TOUCHE !'; sfx(attMe ? 'ok' : 'fail'); buzz(60); if (attMe) me++; else opp++; }
    scEl.textContent = `${me} – ${opp}`;
    await sleep(1100); anim = null; r++;
  }
  const win = D.forfeit || me > opp;
  msg.textContent = D.forfeit ? '🏆 Victoire par forfait' : win ? '🏆 Victoire !' : '😢 Défaite';
  ctx.finish(win ? 1 : 0, D.forfeit ? 'forfait' : `${me}-${opp}`);
}

/* ---------------- Football : air-hockey 1 contre 1 ---------------- */
const FOOT = { win: 3, limit: 120, goal: [32, 68], pr: 8, br: 4, zone: 0.5, field: '#7fd6a3', friction: 0.6, minSpeed: 0, serve: 0, maxSpeed: 260, botSpeed: 115, unit: 'buts', help: 'Garde le doigt sur ton slime pour le déplacer. Interdit de passer la ligne du milieu.' };
const PING = { win: 5, limit: 150, goal: [0, 100], pr: 7, br: 3, zone: 0.66, field: '#4a8fe0', friction: 1, minSpeed: 85, serve: 95, maxSpeed: 300, botSpeed: 150, unit: 'points', help: 'Glisse ta raquette pour renvoyer la balle. Une balle qui passe derrière toi = point pour l\'adversaire.' };
const football = (root, ctx) => airGame(root, ctx, FOOT);
async function airGame(root, ctx, C) {
  const D = duel(ctx);
  const WIN = C.win, LIMIT = C.limit;
  root.innerHTML = `
    <div class="hud"><span class="big" id="sc">0 – 0</span><span>vs ${D.oppName}</span><span id="tm">2:00</span></div>
    <canvas class="full" id="cv"></canvas>
    <div class="help" id="msg">Garde le doigt sur ton slime pour le déplacer. ${C.help} Premier à ${WIN} ${C.unit}.</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), scEl = $(root, '#sc'), tm = $(root, '#tm');
  const { g, W, H } = fitCanvas(cv);
  const FW = 100, FH = 160, PR = C.pr, BR = C.br, GOAL = C.goal, ZY = FH * C.zone;
  const sc = Math.min(W / FW, H / FH), ox = (W - FW * sc) / 2, oy = (H - FH * sc) / 2;
  // Le joueur « hôte » (pair.a) calcule la physique dans son repère (lui en bas) ; l'autre voit le terrain retourné.
  const flip = (p) => ({ x: FW - p.x, y: FH - p.y });
  const toScreen = (p) => { const q = D.host ? p : flip(p); return [ox + q.x * sc, oy + q.y * sc]; };
  const st = { ball: { x: 50, y: 80, vx: 0, vy: 0 }, hp: { x: 50, y: 140, vx: 0, vy: 0 }, gp: { x: 50, y: 20, vx: 0, vy: 0 }, s: [0, 0], t: 0, pause: 1 };
  let myLocal = { x: 50, y: 140 }, ended = false, lastGp = null;
  // saisie : position du doigt dans MON repère (moi en bas)
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: Math.max(PR, Math.min(FW - PR, (e.clientX - r.left - ox) / sc)), y: Math.max(ZY + PR, Math.min(FH - PR, (e.clientY - r.top - oy) / sc)) }; };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); myLocal = pt(e); });
  cv.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') myLocal = pt(e); });

  function draw() {
    g.clearRect(0, 0, W, H);
    g.fillStyle = C.field; g.fillRect(ox, oy, FW * sc, FH * sc);
    for (let k = 0; k < 8; k++) { g.fillStyle = k % 2 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.04)'; g.fillRect(ox, oy + k * FH * sc / 8, FW * sc, FH * sc / 8); }
    g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(ox, oy, FW * sc, FH * sc);
    g.beginPath(); g.moveTo(ox, oy + FH * sc / 2); g.lineTo(ox + FW * sc, oy + FH * sc / 2); g.stroke();
    g.beginPath(); g.arc(ox + FW * sc / 2, oy + FH * sc / 2, 14 * sc, 0, 7); g.stroke();
    const gw = (GOAL[1] - GOAL[0]) * sc, gx0 = ox + GOAL[0] * sc;
    g.fillStyle = D.oppCol; g.fillRect(gx0, oy - 5, gw, 10); g.fillStyle = D.myCol; g.fillRect(gx0, oy + FH * sc - 5, gw, 10);
    g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.strokeRect(gx0, oy - 5, gw, 10); g.strokeRect(gx0, oy + FH * sc - 5, gw, 10);
    const [hx, hy] = toScreen(st.hp), [gx, gy] = toScreen(st.gp);
    slime(g, hx, hy, PR * sc, D.host ? D.myCol : D.oppCol);
    slime(g, gx, gy, PR * sc, D.host ? D.oppCol : D.myCol);
    const [bx, by] = toScreen(st.ball);
    g.fillStyle = '#fff'; g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, BR * sc, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#2a1638'; g.beginPath(); g.arc(bx, by, BR * sc * 0.4, 0, 7); g.fill();
    const mine = D.host ? st.s[0] : st.s[1], theirs = D.host ? st.s[1] : st.s[0];
    scEl.textContent = `${mine} – ${theirs}`;
    const left = Math.max(0, LIMIT - st.t);
    tm.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}` : (C.unit === 'buts' ? 'BUT EN OR' : 'POINT EN OR');
  }

  function finish(winnerHost, forfeit) {
    if (ended) return; ended = true;
    const win = forfeit || (D.host ? winnerHost : !winnerHost);
    const mine = D.host ? st.s[0] : st.s[1], theirs = D.host ? st.s[1] : st.s[0];
    msg.textContent = forfeit ? '🏆 Victoire par forfait' : win ? '🏆 Victoire !' : '😢 Défaite';
    ctx.finish(win ? 1 : 0, forfeit ? 'forfait' : `${mine}-${theirs}`);
  }
  D.onForfeit = () => finish(true, true);

  if (!D.host) {
    // Invité : envoie sa position, affiche l'état reçu
    D.handlers.push((d) => {
      if (d.type === 'fb') { Object.assign(st, d.st); return true; }
      if (d.type === 'fbend') { st.s = d.s; finish(d.w === 'host', false); return true; }
      return false;
    });
    await countdown(root);
    const send = setInterval(() => { if (ended || !root.isConnected) return clearInterval(send); ctx.send({ type: 'pad', p: flip(myLocal) }); }, 40);
    (function loop() { if (!root.isConnected) return; st.gp = { ...st.gp, ...flip(myLocal) }; draw(); if (!ended) requestAnimationFrame(loop); })();
    return;
  }

  // Hôte : physique
  D.handlers.push((d) => { if (d.type === 'pad') { lastGp = d.p; return true; } return false; });
  draw();
  await countdown(root);
  st.pause = 0.6;
  function movePaddle(P, target, dt, maxV) {
    let dx = target.x - P.x, dy = target.y - P.y; const d = Math.hypot(dx, dy), m = maxV * dt;
    if (d > m && d > 0) { dx *= m / d; dy *= m / d; }
    P.vx = dx / dt; P.vy = dy / dt; P.x += dx; P.y += dy;
  }
  function hit(P) {
    const b = st.ball, dx = b.x - P.x, dy = b.y - P.y, d = Math.hypot(dx, dy);
    if (d < PR + BR && d > 0) {
      const nx = dx / d, ny = dy / d;
      b.x = P.x + nx * (PR + BR); b.y = P.y + ny * (PR + BR);
      const rv = (b.vx - P.vx) * nx + (b.vy - P.vy) * ny;
      if (rv < 0) { b.vx -= 1.9 * rv * nx; b.vy -= 1.9 * rv * ny; }
      const s = Math.hypot(b.vx, b.vy); if (s > C.maxSpeed) { b.vx *= C.maxSpeed / s; b.vy *= C.maxSpeed / s; }
    }
  }
  function serve(towardHostSide) { st.ball = { x: 50, y: towardHostSide ? 100 : 60, vx: (Math.random() - 0.5) * C.serve * 0.6, vy: towardHostSide ? C.serve : -C.serve }; st.pause = 1; sfx('whistle'); }
  let last = performance.now(), sendAcc = 0;
  function step(t) {
    if (!root.isConnected || ended) return;
    const dt = Math.max(0.001, Math.min(0.033, (t - last) / 1000)); last = t;
    st.t += dt;
    movePaddle(st.hp, myLocal, dt, 600);
    if (D.isBot) { // IA du bot (en haut)
      const b = st.ball;
      const target = b.y < FH - ZY + 4 ? { x: b.x + (Math.random() - 0.5) * 4, y: Math.max(PR, b.y - 7) } : { x: Math.max(30, Math.min(70, b.x)), y: 18 };
      movePaddle(st.gp, { x: target.x, y: Math.min(FH - ZY - PR, target.y) }, dt, C.botSpeed);
    } else if (lastGp) movePaddle(st.gp, { x: lastGp.x, y: Math.min(FH - ZY - PR, Math.max(PR, lastGp.y)) }, dt, 900);
    if (st.pause > 0) st.pause -= dt;
    else {
      const b = st.ball;
      for (let i = 0; i < 3; i++) {
        b.x += b.vx * dt / 3; b.y += b.vy * dt / 3;
        if (b.x < BR) { b.x = BR; b.vx = Math.abs(b.vx); } if (b.x > FW - BR) { b.x = FW - BR; b.vx = -Math.abs(b.vx); }
        const inGoal = b.x > GOAL[0] && b.x < GOAL[1];
        if (b.y < BR && !inGoal) { b.y = BR; b.vy = Math.abs(b.vy); }
        if (b.y > FH - BR && !inGoal) { b.y = FH - BR; b.vy = -Math.abs(b.vy); }
        hit(st.hp); hit(st.gp);
      }
      b.vx *= Math.pow(C.friction, dt); b.vy *= Math.pow(C.friction, dt);
      if (C.minSpeed) { const sp = Math.hypot(b.vx, b.vy); if (sp < C.minSpeed) { const k = sp > 1 ? C.minSpeed / sp : 0; if (k) { b.vx *= k; b.vy *= k; } else b.vy = b.y < FH / 2 ? C.minSpeed : -C.minSpeed; } }
      if (b.y < -BR) { st.s[0]++; sfx(D.host ? 'ok' : 'fail'); buzz(80); serve(false); }
      else if (b.y > FH + BR) { st.s[1]++; sfx(D.host ? 'fail' : 'ok'); buzz(80); serve(true); }
      const [h, gs] = st.s;
      if (h >= WIN || gs >= WIN || (st.t >= LIMIT && h !== gs)) {
        const w = h > gs ? 'host' : 'guest';
        if (!D.isBot) ctx.send({ type: 'fbend', w, s: st.s });
        draw(); finish(w === 'host', false); return;
      }
    }
    sendAcc += dt;
    if (!D.isBot && sendAcc > 0.045) { sendAcc = 0; ctx.send({ type: 'fb', st: { ball: st.ball, hp: st.hp, s: st.s, t: st.t } }); }
    draw();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Jeux Zozz’lympiques — épreuves 2e vague : haltérophilie, tir à l'arc, ski slalom, lancer du marteau, escalade, judo

const PLUM = '#2a1638', CORAL = '#e8456b', MINT = '#9ee6cf', BUTTER = '#ffd75e', PAPER = '#fff1f5', ROSE = '#ffb6cf';
const FONT = (px, w = 800) => `${w} ${px}px Unbounded, sans-serif`;

/* ---------------- Haltérophilie : soulever puis équilibrer en inclinant le téléphone ---------------- */
async function haltero(root, ctx) {
  root.innerHTML = `
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="kg">100 kg</span><span id="b">Meilleur : —</span></div>
      <div class="phase ph-wait" id="ph">Prépare-toi</div>
      <div class="help" id="msg">&nbsp;</div>
      <div class="runbar" id="rb"><i id="rbi" style="transform:scaleX(0)"></i></div>
      <button class="tapzone" id="tap" disabled>…</button>
    </div>`;
  const cv = $(root, '#cv'), tap = $(root, '#tap'), ph = $(root, '#ph'), msg = $(root, '#msg'), rbi = $(root, '#rbi'), kgEl = $(root, '#kg'), bEl = $(root, '#b');
  const { g, W, H } = fitCanvas(cv);
  const T = tilt(tap, 25);
  let kg = 100, best = 0, fails = 0, totalFails = 0, angle = 0, lifted = 0, state = 'idle';
  const phase = (c, t, s) => { ph.className = 'phase ph-' + c; ph.textContent = t; msg.textContent = s || ' '; };
  function draw() {
    if (!root.isConnected) return;
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H); stands(g, W, 14);
    const gy = H * 0.84;
    g.fillStyle = '#e9b98a'; g.fillRect(W * 0.12, gy, W * 0.76, H - gy);
    // zone d'équilibre
    const cx = W / 2, by = gy - 30 - lifted * H * 0.42;
    if (state === 'balance') {
      g.save(); g.translate(cx, by); g.fillStyle = 'rgba(158,230,207,.45)';
      g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, W * 0.42, -Math.PI / 2 - 0.44, -Math.PI / 2 + 0.44); g.closePath(); g.fill(); g.restore();
    }
    slime(g, cx, gy - 22, 26, ctx.color(ctx.me));
    // bras
    g.strokeStyle = PLUM; g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 18, gy - 30); g.lineTo(cx - 34, by); g.moveTo(cx + 18, gy - 30); g.lineTo(cx + 34, by); g.stroke();
    // barre
    g.save(); g.translate(cx, by); g.rotate(angle * Math.PI / 180);
    g.fillStyle = PLUM; g.fillRect(-W * 0.4, -3, W * 0.8, 6);
    const plates = Math.min(6, 1 + Math.floor((kg - 100) / 20));
    for (const s of [-1, 1]) for (let i = 0; i < plates; i++) { g.fillStyle = [CORAL, BUTTER, MINT, '#c9b8ff'][i % 4]; g.fillRect(s * (W * 0.3 + i * 9) - 4, -22 + i * 1.5, 8, 44 - i * 3); }
    g.restore();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  while (fails < 3) {
    kgEl.textContent = kg + ' kg';
    // PHASE 1 : soulever
    state = 'lift'; angle = 0; lifted = 0;
    const need = Math.round(14 + (kg - 100) / 10 * 1.6);
    phase('run', '① Soulève : tape vite !', `${need} taps en 3 secondes`);
    tap.className = 'tapzone'; tap.textContent = 'TAP'; tap.disabled = false;
    let taps = 0, rec = [];
    const onTap = (e) => { e.preventDefault(); const n = performance.now(); rec = rec.filter((x) => n - x < 1000); if (rec.length >= 15) return; rec.push(n); taps++; lifted = Math.min(1, taps / need); rbi.style.transform = `scaleX(${lifted})`; };
    tap.addEventListener('pointerdown', onTap);
    const t0 = performance.now();
    while (performance.now() - t0 < 3000 && taps < need) await sleep(30);
    tap.removeEventListener('pointerdown', onTap);
    let ok = taps >= need;
    if (ok) {
      // PHASE 2 : équilibre
      state = 'balance'; tap.className = 'tapzone jumpbtn'; tap.textContent = T.sensor ? '⇆ Incline' : '⇆ Glisse';
      phase('jump', '② Tiens la barre droite !', T.sensor ? 'Incline le téléphone pour la redresser' : 'Glisse le doigt à gauche ou à droite pour la redresser');
      T.recalibrate(); sfx('thud'); buzz(60);
      const level = (kg - 100) / 10;
      let vel = 0, push = 0, last = performance.now(); const start = last;
      while (performance.now() - start < 3000) {
        await sleep(16);
        const now = performance.now(), dt = (now - last) / 1000; last = now;
        if (Math.random() < dt * (1.5 + level * 0.25)) push = (Math.random() - 0.5) * (30 + level * 9);
        vel += (push + angle * 0.9 - T.value() * 70) * dt; vel *= Math.pow(0.25, dt);
        angle += vel * dt * 4; push *= Math.pow(0.3, dt);
        rbi.style.transform = `scaleX(${1 - (now - start) / 3000})`;
        if (Math.abs(angle) > 25) { ok = false; break; }
      }
    }
    tap.disabled = true; state = 'idle';
    if (ok) {
      best = kg; bEl.textContent = 'Meilleur : ' + best + ' kg'; sfx('ok'); buzz([40, 40, 40]);
      phase('wait', `✅ ${kg} kg validés !`, 'Barre suivante : +10 kg'); fails = 0; kg += 10;
    } else {
      fails++; totalFails++; sfx('fail'); buzz(200); lifted = 0; angle = Math.sign(angle || 1) * 30;
      phase('wait', `❌ Essai manqué (${fails}/3)`, fails < 3 ? 'Même barre, nouvel essai' : 'Fin de la compétition');
    }
    await sleep(1500);
  }
  T.stop();
  ctx.finish(best * 100 - totalFails, best ? best + ' kg' : '0 kg');
}

/* ---------------- Tir à l'arc : tenir pour stabiliser, relâcher pour tirer ---------------- */
async function arc(root, ctx) {
  root.innerHTML = `
    <div class="hud"><span class="big" id="s">0 pts</span><span id="t">Volée 1/3 · flèche 1/3</span></div>
    <canvas class="full" id="cv"></canvas>
    <div class="help" id="msg">Garde le doigt posé pour bander l'arc et stabiliser le viseur, relâche pour tirer. Tiens le téléphone immobile !</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), sEl = $(root, '#s'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const T = tilt(null);
  const R = Math.min(W, H) * 0.36, cx = W / 2, cy = H * 0.46;
  let aim = { x: 0, y: 0 }, holdStart = 0, holding = false, arrows = [], score = 0, wind = 0, t = 0;
  function draw(now) {
    if (!root.isConnected) return;
    g.fillStyle = '#bfeccb'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    const rings = [['#fff', 10], ['#fff', 9], [PLUM, 8], [PLUM, 7], ['#7cc0e6', 6], ['#7cc0e6', 5], [CORAL, 4], [CORAL, 3], [BUTTER, 2], [BUTTER, 1]];
    rings.forEach(([c], i) => { g.fillStyle = c; g.beginPath(); g.arc(cx, cy, R * (1 - i / 10), 0, 7); g.fill(); g.strokeStyle = 'rgba(42,22,56,.25)'; g.lineWidth = 1; g.stroke(); });
    g.fillStyle = PLUM; g.font = FONT(10); g.textAlign = 'center'; g.fillText('X', cx, cy + 4);
    for (const a of arrows) { g.fillStyle = PLUM; g.beginPath(); g.arc(cx + a.x * R, cy + a.y * R, 4, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); }
    // vent
    g.fillStyle = PLUM; g.font = FONT(11); g.textAlign = 'left'; g.fillText(`Vent ${wind > 0 ? '→' : '←'} ${Math.abs(wind * 10).toFixed(1)}`, 10, 32);
    // viseur
    const sx = cx + aim.x * R, sy = cy + aim.y * R;
    g.strokeStyle = holding ? CORAL : PLUM; g.lineWidth = 3;
    g.beginPath(); g.arc(sx, sy, 16, 0, 7); g.moveTo(sx - 26, sy); g.lineTo(sx - 8, sy); g.moveTo(sx + 8, sy); g.lineTo(sx + 26, sy); g.moveTo(sx, sy - 26); g.lineTo(sx, sy - 8); g.moveTo(sx, sy + 8); g.lineTo(sx, sy + 26); g.stroke();
    if (holding) { const p = Math.min(1, (performance.now() - holdStart) / 1200); g.fillStyle = CORAL; g.fillRect(10, H - 16, (W - 20) * p, 6); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  // dérive du viseur : bruit doux, réduit en bandant, augmenté si le téléphone bouge ou si on tient trop longtemps
  let last = performance.now(), ph1 = Math.random() * 9, ph2 = Math.random() * 9;
  const sway = setInterval(() => {
    if (!root.isConnected) return clearInterval(sway);
    const now = performance.now(), dt = (now - last) / 1000; last = now; t += dt;
    const held = holding ? (now - holdStart) / 1000 : 0;
    let amp = holding ? (held < 1.2 ? 0.55 - held * 0.3 : 0.2 + (held - 1.2) * 0.35) : 0.6;
    amp = Math.max(0.12, Math.min(0.9, amp)) + T.shake() * 0.6;
    aim.x = amp * (Math.sin(t * 1.3 + ph1) * 0.6 + Math.sin(t * 2.9 + ph2) * 0.4);
    aim.y = amp * (Math.cos(t * 1.1 + ph2) * 0.6 + Math.sin(t * 2.3 + ph1) * 0.4);
  }, 16);
  await countdown(root);
  for (let v = 0; v < 3; v++) {
    wind = (Math.random() - 0.5) * 0.3;
    for (let a = 0; a < 3; a++) {
      tEl.textContent = `Volée ${v + 1}/3 · flèche ${a + 1}/3`;
      await new Promise((res) => {
        const down = (e) => { holding = true; holdStart = performance.now(); cv.setPointerCapture(e.pointerId); buzz(20); };
        const up = () => { if (!holding) return; holding = false; cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointerup', up); res(); };
        cv.addEventListener('pointerdown', down); cv.addEventListener('pointerup', up);
      });
      const hx = aim.x + wind * 0.5, hy = aim.y;
      const d = Math.hypot(hx, hy), pts = d >= 1 ? 0 : 10 - Math.floor(d * 10);
      arrows.push({ x: hx, y: hy }); score += pts; sEl.textContent = score + ' pts';
      sfx(pts >= 9 ? 'ok' : 'thud'); buzz(30);
      msg.textContent = pts === 10 ? '🎯 10 ! En plein cœur' : pts ? `${pts} point${pts > 1 ? 's' : ''}` : 'Hors cible';
      await sleep(700);
    }
    await sleep(600); if (v < 2) arrows = [];
  }
  clearInterval(sway); T.stop();
  ctx.finish(score, score + ' pts');
}

/* ---------------- Ski slalom : incliner pour passer les portes ---------------- */
async function ski(root, ctx) {
  const N = 20;
  root.innerHTML = `
    <div class="hud"><span class="big" id="g">Porte 0/${N}</span><span id="t">0.00 s</span></div>
    <canvas class="full" id="cv" style="background:#f4fbff"></canvas>
    <div class="help" id="msg">Incline le téléphone (ou glisse le doigt) pour passer entre les drapeaux. Porte ratée = +2 s.</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), gEl = $(root, '#g'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const T = tilt(cv, 22);
  const gates = Array.from({ length: N }, (_, i) => ({ y: 260 + i * 210, x: 0.22 + Math.random() * 0.56, ok: null }));
  let x = 0.5, dist = 0, pen = 0, passed = 0, start = 0, running = false, trail = [];
  const GW = 0.2, SPEED = 230; // largeur de porte (fraction), vitesse px/s
  function draw() {
    g.fillStyle = '#f4fbff'; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(124,192,230,.35)'; g.lineWidth = 2;
    for (let k = 0; k < 8; k++) { const yy = ((k * 90 - dist) % 720 + 720) % 720; g.beginPath(); g.moveTo(0, yy); g.lineTo(W * 0.15, yy + 20); g.stroke(); }
    const sy = H * 0.72;
    g.strokeStyle = 'rgba(42,22,56,.15)'; g.lineWidth = 3; g.beginPath(); trail.forEach((p, i) => { const yy = sy + (dist - p.d); i ? g.lineTo(p.x * W, yy) : g.moveTo(p.x * W, yy); }); g.stroke();
    for (const gt of gates) {
      const yy = sy - (gt.y - dist); if (yy < -40 || yy > H + 40) continue;
      const col = gt.ok === false ? '#bbb' : (gates.indexOf(gt) % 2 ? CORAL : '#4a8fe0');
      for (const s of [-1, 1]) { const fx = (gt.x + s * GW / 2) * W; g.strokeStyle = PLUM; g.lineWidth = 2; g.beginPath(); g.moveTo(fx, yy); g.lineTo(fx, yy - 34); g.stroke(); g.fillStyle = col; g.beginPath(); g.moveTo(fx, yy - 34); g.lineTo(fx + s * -18, yy - 28); g.lineTo(fx, yy - 20); g.fill(); }
    }
    // skieur
    const px = x * W, lean = T.value();
    g.save(); g.translate(px, sy); g.rotate(lean * 0.4);
    g.fillStyle = PLUM; g.fillRect(-14, 10, 4, 22); g.fillRect(10, 10, 4, 22);
    g.restore();
    slime(g, px, sy, 15, ctx.color(ctx.me));
    g.fillStyle = BUTTER; g.beginPath(); g.ellipse(px, sy - 12, 15, 7, 0, Math.PI, 0); g.fill();
  }
  draw();
  await countdown(root);
  running = true; start = performance.now(); T.recalibrate();
  let last = performance.now();
  await new Promise((res) => {
    function frame(now) {
      if (!root.isConnected) return res();
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
      x = Math.max(0.05, Math.min(0.95, x + T.value() * 0.75 * dt));
      dist += SPEED * dt;
      trail.push({ x, d: dist }); if (trail.length > 60) trail.shift();
      for (const gt of gates) if (gt.ok === null && dist >= gt.y) {
        gt.ok = Math.abs(x - gt.x) <= GW / 2;
        passed++; gEl.textContent = `Porte ${passed}/${N}`;
        if (!gt.ok) { pen += 2; sfx('fail'); buzz(120); msg.textContent = '❌ Porte manquée : +2 s'; } else { sfx('tick'); msg.textContent = '✅'; }
        ctx.prog(passed / N);
      }
      tEl.textContent = ((now - start) / 1000 + pen).toFixed(2) + ' s';
      draw();
      if (passed >= N) return res();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  T.stop();
  const time = (performance.now() - start) / 1000 + pen;
  ctx.finish(-Math.round(time * 100) / 100, time.toFixed(2) + ' s');
}

/* ---------------- Lancer du marteau : tourner puis lâcher dans la zone ---------------- */
async function marteau(root, ctx) {
  root.innerHTML = `
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="b">Meilleur : —</span><span id="tr">Essai 1/3</span></div>
      <div class="help" id="msg">Fais des cercles de plus en plus vite, puis lève le doigt quand la boule passe dans la zone verte.</div>
      <div class="wheel" id="wh"><canvas id="dial" style="position:absolute;inset:0;width:100%;height:100%"></canvas><span id="sp">0 tr/s</span></div>
    </div>`;
  const cv = $(root, '#cv'), wh = $(root, '#wh'), dial = $(root, '#dial'), msg = $(root, '#msg'), bEl = $(root, '#b'), trEl = $(root, '#tr'), spEl = $(root, '#sp');
  const { g, W, H } = fitCanvas(cv);
  const D = fitCanvas(dial);
  const SECTOR = -Math.PI / 2, HALF = 0.38; // zone de lâcher : en haut
  let marks = [], fly = null, best = 0, ang = 0, speed = 0;
  const X = (m) => W * 0.08 + (m / 95) * W * 0.86;
  function draw() {
    if (!root.isConnected) return;
    g.fillStyle = '#bfeccb'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2;
    for (const m of [50, 60, 70, 80, 90]) { g.beginPath(); g.moveTo(X(m), H * 0.3); g.lineTo(X(m), H * 0.95); g.stroke(); g.fillStyle = PLUM; g.font = FONT(9); g.textAlign = 'center'; g.fillText(m + ' m', X(m), H * 0.27); }
    g.fillStyle = BUTTER; g.fillRect(X(86.74) - 2, H * 0.3, 4, H * 0.65); g.fillStyle = PLUM; g.fillText('RM 86,74', X(86.74), H * 0.98);
    g.fillStyle = '#c9d3e3'; g.beginPath(); g.arc(W * 0.08, H * 0.62, 14, 0, 7); g.fill();
    for (const mk of marks) { g.fillStyle = mk.foul ? '#bbb' : CORAL; g.beginPath(); g.arc(X(mk.d), H * 0.62, 6, 0, 7); g.fill(); }
    if (fly) { const k = Math.min(1, (performance.now() - fly.t0) / 1000); const fx = W * 0.08 + (X(fly.d) - W * 0.08) * k, fy = H * 0.62 - Math.sin(k * Math.PI) * H * 0.4; g.fillStyle = PLUM; g.beginPath(); g.arc(fx, fy, 6, 0, 7); g.fill(); if (k >= 1 && !fly.done) { fly.done = true; marks.push({ d: fly.d, foul: fly.foul }); sfx('thud'); } }
    slime(g, W * 0.08, H * 0.62 - 6, 11, ctx.color(ctx.me));
    // cadran
    const dg = D.g, w = D.W, h = D.H, c = w / 2, r = w * 0.4;
    dg.clearRect(0, 0, w, h);
    dg.strokeStyle = MINT; dg.lineWidth = 16; dg.beginPath(); dg.arc(c, c, r, SECTOR - HALF, SECTOR + HALF); dg.stroke();
    dg.strokeStyle = 'rgba(42,22,56,.15)'; dg.lineWidth = 2; dg.beginPath(); dg.moveTo(c, c); dg.lineTo(c + Math.cos(ang) * r, c + Math.sin(ang) * r); dg.stroke();
    dg.fillStyle = PLUM; dg.beginPath(); dg.arc(c + Math.cos(ang) * r, c + Math.sin(ang) * r, 11, 0, 7); dg.fill();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  for (let at = 1; at <= 3; at++) {
    trEl.textContent = `Essai ${at}/3`; speed = 0; fly = null;
    msg.textContent = 'Tourne ! Au moins 3 tours, puis lève le doigt dans la zone verte.';
    const res = await new Promise((resolve) => {
      let lastA = null, lastT = 0, turns = 0;
      const pa = (e) => { const r = wh.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
      const down = (e) => { wh.setPointerCapture(e.pointerId); lastA = pa(e); lastT = performance.now(); ang = lastA; };
      const move = (e) => {
        if (lastA === null) return;
        const a = pa(e), now = performance.now(); let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
        const inst = Math.abs(d) / (2 * Math.PI) / Math.max(0.008, (now - lastT) / 1000);
        speed = speed * 0.9 + Math.min(inst, 7) * 0.1; turns += Math.abs(d) / (2 * Math.PI);
        lastA = a; lastT = now; ang = a; spEl.textContent = speed.toFixed(1) + ' tr/s';
        if (Math.random() < 0.05) sfx('tick');
      };
      const up = () => {
        if (lastA === null) return;
        wh.removeEventListener('pointerdown', down); wh.removeEventListener('pointermove', move); wh.removeEventListener('pointerup', up);
        let off = ang - SECTOR; while (off > Math.PI) off -= 2 * Math.PI; while (off < -Math.PI) off += 2 * Math.PI;
        resolve({ off: Math.abs(off), turns, speed });
      };
      wh.addEventListener('pointerdown', down); wh.addEventListener('pointermove', move); wh.addEventListener('pointerup', up);
    });
    const foul = res.off > HALF || res.turns < 3;
    const acc = 1 - res.off / HALF;
    const d = foul ? 0 : Math.round((25 + 13 * Math.min(res.speed, 5) * (0.6 + 0.4 * acc)) * 100) / 100;
    fly = { t0: performance.now(), d: foul ? 15 : d, foul };
    await sleep(1100);
    if (foul) { msg.textContent = res.turns < 3 ? '🚩 Moins de 3 tours : essai nul' : '🚩 Dans la cage ! Essai nul'; sfx('whistle'); }
    else { msg.textContent = `📏 ${d.toFixed(2).replace('.', ',')} m`; if (d * 100 > best) { best = Math.round(d * 100); bEl.textContent = 'Meilleur : ' + (best / 100).toFixed(2).replace('.', ',') + ' m'; sfx('ok'); } }
    await sleep(1400);
  }
  ctx.finish(best, best ? (best / 100).toFixed(2).replace('.', ',') + ' m' : 'Nul');
}

/* ---------------- Escalade de vitesse : gauche / droite selon la prise allumée ---------------- */
async function escalade(root, ctx) {
  const N = 20;
  root.innerHTML = `
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="h">0 / ${N}</span><span id="t">0.00 s</span></div>
      <div class="rank-row"><div class="pos p1" id="pos">1<sup>er</sup></div><div class="mini" id="mini"></div></div>
      <div class="duo"><button class="tapzone" id="L" disabled>◀</button><button class="tapzone" id="R" disabled>▶</button></div>
    </div>`;
  const cv = $(root, '#cv'), L = $(root, '#L'), Rb = $(root, '#R'), hEl = $(root, '#h'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const st = liveStandings(ctx, $(root, '#pos'), $(root, '#mini'));
  const holds = Array.from({ length: N }, () => (Math.random() < 0.5 ? 0 : 1));
  let h = 0, frozen = 0, done = false, start = 0;
  const shown = {};
  function draw() {
    if (!root.isConnected) return;
    st.update();
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    const n = ctx.players.length, lw = W / n;
    ctx.players.forEach((p, i) => {
      const x0 = i * lw; g.fillStyle = i % 2 ? '#ffd6e3' : '#ffe6ee'; g.fillRect(x0 + 1, 0, lw - 2, H);
      if (p.id === ctx.me) { g.fillStyle = 'rgba(232,69,107,.12)'; g.fillRect(x0 + 1, 0, lw - 2, H); }
      const v = ctx.progs[p.id] || 0; shown[p.id] = (shown[p.id] ?? 0) + (v - (shown[p.id] ?? 0)) * 0.2;
      const top = 24, bot = H - 20, y = bot - (bot - top) * shown[p.id];
      if (p.id === ctx.me) for (let k = h; k < Math.min(N, h + 4); k++) { const yy = bot - (bot - top) * ((k + 1) / N); g.fillStyle = k === h ? CORAL : 'rgba(42,22,56,.25)'; g.beginPath(); g.arc(x0 + lw * (holds[k] ? 0.72 : 0.28), yy, Math.min(7, lw * 0.15), 0, 7); g.fill(); }
      slime(g, x0 + lw / 2, y, Math.min(13, lw * 0.3), p.color);
      g.font = `${Math.min(14, lw * 0.5)}px serif`; g.textAlign = 'center'; g.fillText(p.flag, x0 + lw / 2, H - 4);
    });
    g.fillStyle = BUTTER; g.fillRect(0, 18, W, 3); g.fillStyle = PLUM; g.font = FONT(9); g.textAlign = 'left'; g.fillText('15 m', 4, 14);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  L.disabled = Rb.disabled = false; start = performance.now();
  const timer = setInterval(() => { if (!root.isConnected) return clearInterval(timer); if (!done) tEl.textContent = ((performance.now() - start) / 1000).toFixed(2) + ' s'; }, 50);
  const press = (side) => (e) => {
    e.preventDefault(); if (done || performance.now() < frozen) return;
    if (holds[h] === side) { h++; sfx('tick'); }
    else { h = Math.max(0, h - 1); frozen = performance.now() + 400; sfx('fail'); buzz(120); }
    hEl.textContent = `${h} / ${N}`; ctx.prog(h / N);
    if (h >= N) { done = true; L.disabled = Rb.disabled = true; const t = (performance.now() - start) / 1000; tEl.textContent = t.toFixed(2) + ' s'; ctx.finish(-Math.round(t * 100) / 100, t.toFixed(2) + ' s'); }
  };
  L.addEventListener('pointerdown', press(0)); Rb.addEventListener('pointerdown', press(1));
}

/* ---------------- Judo : duel de réflexes au signal « Hajime ! » ---------------- */
async function judo(root, ctx) {
  const pair = ctx.current.pairs.find((p) => p.a === ctx.me || p.b === ctx.me);
  const oppId = pair.a === ctx.me ? pair.b : pair.a, isBot = oppId === 'BOT', host = pair.a === ctx.me;
  const oppName = isBot ? '🤖 Bot' : ctx.name(oppId), oppCol = isBot ? '#8a8fa8' : ctx.color(oppId);
  root.innerHTML = `
    <div class="hud"><span class="big" id="sc">0 – 0</span><span>vs ${oppName}</span><span>Au meilleur des 5</span></div>
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot"><div class="phase ph-wait" id="ph">Prépare-toi…</div><button class="tapzone" id="tap" disabled>Attends…</button></div>`;
  const cv = $(root, '#cv'), tap = $(root, '#tap'), ph = $(root, '#ph'), scEl = $(root, '#sc');
  const { g, W, H } = fitCanvas(cv);
  let me = 0, opp = 0, throwAnim = null, forfeit = false;
  const inbox = [], waiters = [];
  ctx.onMsg((d) => { if (d.type === 'left') forfeit = true; else inbox.push(d); while (waiters.length) waiters.shift()(); });
  const next = (type, r) => new Promise((res) => { const c = () => { if (forfeit) return res(null); const i = inbox.findIndex((m) => m.type === type && m.r === r); if (i >= 0) return res(inbox.splice(i, 1)[0]); waiters.push(c); }; c(); });
  function draw() {
    if (!root.isConnected) return;
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H); stands(g, W, 14);
    g.fillStyle = '#ffe08a'; g.fillRect(W * 0.08, H * 0.7, W * 0.84, H * 0.16); g.fillStyle = CORAL; g.fillRect(W * 0.08, H * 0.7, W * 0.84, 4);
    const r = Math.min(W, H) * 0.12;
    let mx = W * 0.32, ox = W * 0.68, my = H * 0.6, oy = H * 0.6, mr = 0, orr = 0;
    if (throwAnim) { const k = Math.min(1, (performance.now() - throwAnim.t0) / 600); if (throwAnim.win) { ox = W * 0.68 - k * W * 0.2; oy = H * 0.6 - Math.sin(k * Math.PI) * H * 0.35; orr = k * Math.PI * 2; } else { mx = W * 0.32 + k * W * 0.2; my = H * 0.6 - Math.sin(k * Math.PI) * H * 0.35; mr = -k * Math.PI * 2; } }
    for (const [x, y, col, rot, belt] of [[mx, my, ctx.color(ctx.me), mr, PLUM], [ox, oy, oppCol, orr, CORAL]]) {
      g.save(); g.translate(x, y); g.rotate(rot); g.translate(-x, -y);
      slime(g, x, y, r, col, '#fff'); g.fillStyle = '#fff'; g.fillRect(x - r, y + r * 0.1, r * 2, r * 0.6); g.fillStyle = belt; g.fillRect(x - r, y + r * 0.3, r * 2, r * 0.14);
      g.restore();
    }
    g.fillStyle = PLUM; g.font = FONT(11); g.textAlign = 'center'; g.fillText('TOI', W * 0.32, H * 0.95); g.fillText(oppName, W * 0.68, H * 0.95);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  for (let r = 0; me < 3 && opp < 3 && !forfeit; r++) {
    ph.className = 'phase ph-wait'; ph.textContent = 'Prêt…'; tap.disabled = false; tap.className = 'tapzone locked'; tap.textContent = 'Attends…';
    let delay;
    if (isBot || host) { delay = 1500 + Math.random() * 2500; if (!isBot) ctx.send({ type: 'jd', r, delay }); }
    else { const m = await next('jd', r); if (!m) break; delay = m.delay; }
    const mine = await new Promise((res) => {
      let sig = 0;
      const timer = setTimeout(() => { sig = performance.now(); ph.className = 'phase ph-jump'; ph.textContent = 'HAJIME !'; tap.className = 'tapzone jumpbtn'; tap.textContent = 'TAP !'; sfx('whistle'); buzz(50); }, delay);
      const h = (e) => { e.preventDefault(); tap.removeEventListener('pointerdown', h); clearTimeout(cut); if (!sig) { clearTimeout(timer); res(-1); } else res(performance.now() - sig); };
      const cut = setTimeout(() => { tap.removeEventListener('pointerdown', h); res(9999); }, delay + 3000);
      tap.addEventListener('pointerdown', h);
    });
    tap.disabled = true;
    let theirs;
    if (isBot) { await sleep(300); theirs = Math.random() < 0.06 ? -1 : 260 + Math.random() * 240; }
    else { ctx.send({ type: 'rt', r, t: mine }); const m = await next('rt', r); if (!m) break; theirs = m.t; }
    const valid = (t) => t >= 0 && t < 9999;
    let iWin;
    if (!valid(mine) && !valid(theirs)) iWin = null;
    else if (!valid(mine)) iWin = false; else if (!valid(theirs)) iWin = true; else iWin = mine < theirs || (mine === theirs && host);
    if (iWin === null) { ph.textContent = 'Double faute : on rejoue'; }
    else {
      if (iWin) me++; else opp++;
      throwAnim = { t0: performance.now(), win: iWin }; sfx(iWin ? 'ok' : 'fail'); sfx('thud'); buzz(iWin ? 60 : 200);
      ph.className = 'phase ' + (iWin ? 'ph-jump' : 'ph-run');
      ph.textContent = iWin ? (mine < 0 ? 'IPPON !' : `IPPON ! ${Math.round(mine)} ms`) : mine === -1 ? 'Faux départ : point perdu' : `Trop lent (${Math.round(mine)} ms)`;
    }
    scEl.textContent = `${me} – ${opp}`;
    await sleep(1600); throwAnim = null;
  }
  const win = forfeit || me > opp;
  ph.textContent = forfeit ? '🏆 Victoire par forfait' : win ? '🏆 Victoire !' : '😢 Défaite';
  ctx.finish(win ? 1 : 0, forfeit ? 'forfait' : `${me}-${opp}`);
}

let gameStarted = false;

function renderEvent() {
  const cur = S.current, ev = S.events[cur.event];
  runningGameId = cur.id;
  gameStarted = false;
  removeWait();
  const strip = recordStrip(cur.event);
  app.innerHTML = `
    <div class="title" style="margin-top:6px">Épreuve ${cur.index + 1}/${cur.count}</div>
    <h1 class="logo" style="margin:10px 0 14px;font-size:44px">${esc(ev.name)}</h1>
    <div class="card"><h2>Règles</h2><ul class="rules">${RULES[cur.event].map((r) => `<li>${esc(r)}</li>`).join('')}</ul></div>
    <div id="rec"></div>
    <div class="card" id="rdy"></div>
    <button id="ready">✔ J'ai compris, prêt !</button>`;
  if (strip) document.getElementById('rec').append(strip);
  scene3d.setEvent(cur.event);
  document.getElementById('ready').onclick = () => { sound.unlock(); sfx('tick'); if (['haltero', 'arc', 'ski'].includes(cur.event)) requestSensors(); socket.emit('ready'); };
  updateRules();
  if (cur.go) startGame();
}
function updateRules() {
  const el = document.getElementById('rdy'); if (!el) return;
  const ready = new Set(S.current.ready || []);
  const connected = S.players.filter((p) => p.connected);
  el.innerHTML = `<h2>Prêts : ${connected.filter((p) => ready.has(p.id)).length}/${connected.length}</h2><div class="flags">${connected.map((p) => `<span class="rd ${ready.has(p.id) ? 'ok' : ''}" title="${esc(p.name)}">${country(p.country).flag}</span>`).join('')}</div>`;
  const b = document.getElementById('ready');
  if (b && ready.has(pid)) { b.disabled = true; b.textContent = 'En attente des autres…'; }
}

function startGame() {
  const cur = S.current, ev = S.events[cur.event];
  gameStarted = true;
  gameMsgHandler = null; gameInbox = [];
  app.innerHTML = `<div class="game" id="g"></div>`;
  const root = document.getElementById('g');
  const head = document.createElement('div');
  head.className = 'title';
  head.textContent = `Épreuve ${cur.index + 1}/${cur.count} · ${ev.name}`;
  const box = document.createElement('div');
  box.style.cssText = 'flex:1;display:flex;flex-direction:column;gap:6px;min-height:0';
  const strip = recordStrip(cur.event);
  root.append(...(strip ? [head, strip, box] : [head, box]));
  gameProgs = {};
  const ctx = {
    me: pid,
    current: cur,
    name: (id) => player(id)?.name || '?',
    color: (id) => country(player(id)?.country).color,
    players: S.players.filter((p) => p.connected).map((p) => ({ id: p.id, name: esc(p.name), flag: country(p.country).flag, color: country(p.country).color })),
    get progs() { return gameProgs; },
    prog: (v) => { gameProgs[pid] = v; socket.emit('prog', { v }); scene3d.setProg(pid, v); },
    send: (d) => socket.emit('curl', d),
    onMsg: (fn) => { gameMsgHandler = fn; const q = gameInbox; gameInbox = []; q.forEach(fn); },
    finish: (score, detail) => {
      if (myResult || runningGameId !== cur.id) return;
      const rec = RECORDS[cur.event];
      let flag = '';
      if (rec) {
        const v = rawValue(cur.event, score);
        const pb = Number(store.get('bg_pb_' + cur.event)) || null;
        if (v > 0 && better(rec, v, rec.value)) flag = 'wr';
        else if (v > 0 && better(rec, v, pb)) flag = 'pb';
        if (v > 0 && better(rec, v, pb)) store.set('bg_pb_' + cur.event, String(v));
        if (flag === 'wr') detail += ' 🔥 RECORD';
      }
      myResult = { score, detail, flag };
      sfx(flag ? 'fanfare' : 'crowd'); buzz([60, 40, 60]);
      socket.emit('result', { score, detail });
      scene3d.cheer(pid);
      setTimeout(updateWait, 900);
    },
  };
  scene3d.setEvent(cur.event);
  GAMES[cur.event](box, ctx);
}
function updateWait() {
  if (!myResult || S.phase !== 'event') return;
  let w = document.getElementById('wait');
  if (!w) { w = document.createElement('div'); w.id = 'wait'; w.className = 'card wait'; document.body.appendChild(w); }
  const connected = S.players.filter((p) => p.connected);
  const done = connected.filter((p) => S.done.includes(p.id)).length;
  const nr = myResult.flag === 'wr' ? '<div class="newrec">🔥 Nouveau record ' + (RECORDS[S.current.event]?.world ? 'du monde' : 'Zozz’lympique') + ' !</div>'
    : myResult.flag === 'pb' ? '<div class="newrec">Record perso battu !</div>' : '';
  w.innerHTML = nr + `<b>Terminé : ${esc(myResult.detail || '')}</b><div class="muted">En attente des autres… ${done}/${connected.length}</div>`;
}
const removeWait = () => document.getElementById('wait')?.remove();

const MEDAL = ['🥇', '🥈', '🥉'];
function podiumHTML(groups, cls = '') {
  const cols = ['#ffd75e', '#c9d3e3', '#f4b48a'];
  const step = (r, h) => {
    const list = groups[r] || [];
    if (!list.length) return '<div class="step"></div>';
    return `<div class="step"><div class="fl">${list.map((x) => country(x.p.country).flag).join('')}</div>
      <div class="who">${list.map((x) => esc(x.p.name)).join('<br>')}<br><span style="font-weight:600">${esc(list[0].sub)}</span></div>
      <div class="block" style="height:${h}px;background:${cols[r]}">${r + 1}</div></div>`;
  };
  return `<div class="podium ${cls}">${step(1, 80)}${step(0, 120)}${step(2, 55)}</div>`;
}
let revealView = null;
// Photo-finish : les 3 premiers à l'instant où le vainqueur franchit la ligne
function drawPhotoFinish(cv, top) {
  const dpr = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, fx = W * 0.72, pxs = 1100; // pixels par seconde d'écart
  g.fillStyle = '#ffb6cf'; g.fillRect(0, 0, W, H);
  for (let x = fx % 22 - 22; x < W; x += 22) { g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x, 0, 1, H); }
  for (let y = 0, k = 0; y < H; y += 8, k++) { g.fillStyle = k % 2 ? '#2a1638' : '#fff'; g.fillRect(fx - 3, y, 6, 8); }
  const lane = H / top.length;
  top.forEach((x, i) => {
    const p = player(x.id); if (!p) return;
    const dt = Math.abs(x.score - top[0].score), cx = fx - dt * pxs + 4, cy = lane * i + lane / 2, rr = Math.min(lane * 0.36, 20);
    g.fillStyle = country(p.country).color; g.beginPath(); g.ellipse(cx - rr, cy, rr, rr * 0.9, 0, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cx - rr * 0.6, cy - rr * 0.1, rr * 0.2, 0, 7); g.fill();
    g.fillStyle = '#2a1638'; g.beginPath(); g.arc(cx - rr * 0.52, cy - rr * 0.08, rr * 0.1, 0, 7); g.fill();
    g.font = '800 11px Unbounded, sans-serif'; g.textAlign = 'left';
    g.fillText(`${i + 1}. ${p.name.slice(0, 10)}`, 6, cy - 4);
    g.font = '600 12px Barlow, sans-serif'; g.fillText(i ? `+${dt.toFixed(2).replace('.', ',')} s` : (x.detail || ''), 6, cy + 12);
  });
}
function renderReveal() {
  removeWait();
  const r = S.reveal, key = S.current?.id + ':' + r.event;
  if (!revealView || revealView.key !== key) {
    revealView = { key, step: 'podium' };
    clearTimeout(renderReveal.t);
    renderReveal.t = setTimeout(() => { if (revealView.key === key && revealView.step === 'podium') { revealView.step = 'ranking'; if (S.phase === 'reveal') renderReveal(); } }, 6000);
  }
  const host = S.hostId === pid;
  const last = S.index >= S.program.length - 1;
  const duel = S.events[r.event].type === 'duel';
  const ev = S.events[r.event];
  const hostBtns = host ? `<button id="next">${last ? '🏆 Podium final' : '▶️ Épreuve suivante'}</button>${!last ? '<button class="alt" id="pod">Terminer maintenant</button>' : ''}`
    : '<div class="card muted">L\'hôte lance la suite…</div>';
  if (revealView.step === 'podium') {
    const groups = [[], [], []];
    if (duel) for (const x of r.ranking) { if (x.rank === 1) groups[0].push({ p: player(x.id), sub: '+10 pts' }); }
    else for (const x of r.ranking) if (x.rank && x.rank <= 3 && player(x.id)) groups[x.rank - 1].push({ p: player(x.id), sub: x.detail || '' });
    const meRow = r.ranking.find((x) => x.id === pid);
    const RACE = ['sprint', 'haies', 'cyclisme', 'natation', 'aviron', 'ski', 'escalade'];
    const top = r.ranking.filter((x) => x.score != null).slice(0, 3);
    const pf = RACE.includes(r.event) && top.length >= 2 && Math.abs(top[0].score - top[1].score) <= 0.15;
    app.innerHTML = `
      <div class="title" style="margin-top:6px">Résultats</div>
      <h1 class="logo" style="margin:8px 0 12px;font-size:40px">${esc(ev.name)}</h1>
      ${pf ? '<div class="card pfcard"><h2>📸 Photo-finish</h2><canvas id="pf"></canvas></div>' : ''}
      <div class="card">${duel ? '<h2 style="text-align:center">Vainqueurs des duels</h2>' : ''}${podiumHTML(groups)}</div>
      ${meRow ? `<div class="card dark" style="text-align:center"><h2 style="margin:0">Toi : ${meRow.rank ? (duel ? (meRow.rank === 1 ? 'victoire' : 'défaite') : meRow.rank + (meRow.rank === 1 ? 'er' : 'e')) : '—'} · ${esc(meRow.detail || '')} · +${meRow.pts} pts</h2></div>` : ''}
      <button class="ghost" id="seeRank">📊 Classement provisoire</button>`;
    scene3d.setEvent('reveal', r.ranking.slice(0, 3).map((x) => x.id));
    document.getElementById('seeRank').onclick = () => { revealView.step = 'ranking'; renderReveal(); };
    if (pf) drawPhotoFinish(document.getElementById('pf'), top);
    if (!revealView.sang) { revealView.sang = true; sfx(pf ? 'tick' : 'fanfare'); if (pf) setTimeout(() => sfx('fanfare'), 400); }
    return;
  }
  // classement provisoire avec évolution des places
  const prevTotal = Object.fromEntries(r.ranking.map((x) => [x.id, x.pts]));
  const rankOf = (arr, val) => { const sorted = [...arr].sort((a, b) => b.v - a.v); const m = new Map(); let rk = 0; sorted.forEach((x, i) => { if (i === 0 || x.v !== sorted[i - 1].v) rk = i; m.set(x.id, rk); }); return m; };
  const now = rankOf(S.players.map((p) => ({ id: p.id, v: p.total })));
  const before = rankOf(S.players.map((p) => ({ id: p.id, v: p.total - (prevTotal[p.id] || 0) })));
  const rows = [...S.players].sort((a, b) => b.total - a.total).map((p) => {
    const d = before.get(p.id) - now.get(p.id);
    const mv = S.index === 0 ? '' : d > 0 ? `<span class="move up">▲${d}</span>` : d < 0 ? `<span class="move down">▼${-d}</span>` : '<span class="move">=</span>';
    const pts = prevTotal[p.id] ? ` <span style="opacity:.6;font-size:14px">(+${prevTotal[p.id]})</span>` : '';
    return playerRow(p, `${MEDAL[now.get(p.id)] || now.get(p.id) + 1 + 'e'} · ${p.total} pts${pts}`).replace('<span class="dot"', mv + '<span class="dot"');
  }).join('');
  app.innerHTML = `
    <div class="title" style="margin-top:6px">Après ${S.index + 1} épreuve${S.index ? 's' : ''} sur ${S.program.length}</div>
    <div class="card" style="margin-top:10px"><h2>Classement provisoire</h2><div class="players">${rows}</div></div>
    <button class="ghost" id="seePod">🏅 Revoir le podium</button>
    ${hostBtns}`;
  scene3d.setEvent('reveal', [...S.players].sort((a, b) => b.total - a.total).slice(0, 3).map((p) => p.id));
  document.getElementById('seePod').onclick = () => { revealView.step = 'podium'; renderReveal(); };
  const n = document.getElementById('next'); if (n) n.onclick = () => socket.emit('next');
  const p = document.getElementById('pod'); if (p) p.onclick = () => socket.emit('podium');
}

function renderFinal() {
  removeWait();
  const host = S.hostId === pid;
  const sorted = [...S.players].sort((a, b) => b.total - a.total);
  // rangs avec égalités
  let rank = 0;
  const ranked = sorted.map((p, i) => { if (i === 0 || p.total !== sorted[i - 1].total) rank = i; return { p, rank }; });
  const step = (r, h) => {
    const list = ranked.filter((x) => x.rank === r);
    if (!list.length) return '<div class="step"></div>';
    const cols = ['#ffd75e', '#c9d3e3', '#f4b48a'];
    return `<div class="step"><div class="fl">${list.map((x) => country(x.p.country).flag).join('')}</div>
      <div class="who">${list.map((x) => esc(x.p.name)).join('<br>')}<br>${list[0].p.total} pts</div>
      <div class="block" style="height:${h}px;background:${cols[r]}">${r + 1}</div></div>`;
  };
  app.innerHTML = `
    <h1 class="logo" style="margin-top:2vh;font-size:36px">Podium final</h1>
    <div class="card"><div class="podium">${step(1, 90)}${step(0, 130)}${step(2, 65)}</div></div>
    <div class="card"><div class="players">${ranked.map(({ p, rank }) => playerRow(p, `${MEDAL[rank] || rank + 1 + 'e'} · ${p.total} pts`)).join('')}</div></div>
    ${medalTable()}
    ${host ? '<button id="lobby">🔁 Retour au lobby</button>' : '<div class="card muted">Bravo à tous ! L\'hôte relance la partie.</div>'}
    <button class="ghost" id="quit">Quitter la partie</button>`;
  document.getElementById('quit').onclick = () => { socket.emit('leave'); store.del('bg_room'); S = null; history.replaceState(null, '', location.pathname); render(); };
  scene3d.setEvent('final', ranked.filter((x) => x.rank < 3).map((x) => x.p.id));
  const l = document.getElementById('lobby'); if (l) l.onclick = () => socket.emit('toLobby');
}

  function makeSlime(color) {

    const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, clearcoat: 0.25, clearcoatRoughness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, mat); body.scale.set(0.95, 0.95, 0.95); body.position.y = 0.55; g.add(body);
    for (const s of [-1, 1]) {
      const e = new THREE.Mesh(eyeGeo, white); e.position.set(s * 0.16, 0.7, 0.42); g.add(e);
      const p = new THREE.Mesh(pupGeo, ink); p.position.set(s * 0.16, 0.7, 0.5); g.add(p);
      // baskets
      const shoe = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.18, 4, 10), white);
      shoe.rotation.x = Math.PI / 2; shoe.position.set(s * 0.2, 0.09, 0.06); g.add(shoe);
      const sole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.04, 0.36), pink);
      sole.position.set(s * 0.2, 0.02, 0.06); g.add(sole);
    }
    const acc = new THREE.Group(); g.add(acc);
    g.userData = { body, acc, phase: Math.random() * 6, jump: 0, target: new THREE.Vector3(), accFor: null };
    scene.add(g); return g;
  }

  // Accessoire selon l'épreuve
  function accessory(kind, i) {
    const a = new THREE.Group();
    const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); a.add(m); return m; };
    if (kind === 'sprint') { // bandeau éponge + dossard
      add(new THREE.TorusGeometry(0.44, 0.06, 10, 32), white, 0, 0.85, 0, Math.PI / 2);
      add(new THREE.TorusGeometry(0.445, 0.025, 8, 32), pink, 0, 0.85, 0, Math.PI / 2);
      bib(a, i);
    } else if (kind === 'tir') { // casquette + lunettes de tir
      add(new THREE.SphereGeometry(0.42, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), ink, 0, 0.9, 0);
      add(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 24, 1, false, -Math.PI / 2, Math.PI), ink, 0, 0.92, 0.25);
      for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.1, 0.1, 0.03, 16), M(0xffcf4a, { transparent: true, opacity: 0.75 }), s * 0.16, 0.72, 0.5, Math.PI / 2);
    } else if (kind === 'hauteur') { // dossard + poignets
      bib(a, i);
      add(new THREE.TorusGeometry(0.44, 0.04, 8, 32), mint, 0, 0.85, 0, Math.PI / 2);
      for (const s of [-1, 1]) add(new THREE.TorusGeometry(0.08, 0.04, 8, 16), mint, s * 0.5, 0.45, 0, 0, Math.PI / 2);
    } else if (kind === 'hiphop') { // casquette à l'envers + casque audio
      add(new THREE.SphereGeometry(0.42, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), pink, 0, 0.9, 0);
      add(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 24, 1, false, Math.PI / 2, Math.PI), pink, 0, 0.92, -0.25);
      add(new THREE.TorusGeometry(0.47, 0.03, 8, 32, Math.PI), ink, 0, 0.6, 0);
      for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.13, 0.13, 0.08, 16), ink, s * 0.47, 0.6, 0, 0, 0, Math.PI / 2);
    } else if (kind === 'curling') { // bonnet à pompon + balai
      add(new THREE.SphereGeometry(0.43, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M(0x2a1638), 0, 0.82, 0);
      add(new THREE.TorusGeometry(0.42, 0.06, 10, 32), white, 0, 0.83, 0, Math.PI / 2);
      add(new THREE.SphereGeometry(0.11, 12, 10), white, 0, 1.28, 0);
      add(new THREE.CylinderGeometry(0.025, 0.025, 1.2, 8), M(0xe39a62), 0.55, 0.6, 0.1, 0, 0, 0.3);
      add(new THREE.BoxGeometry(0.3, 0.08, 0.12), pink, 0.72, 0.04, 0.1);
    } else if (kind === 'helmet') { // casque
      add(new THREE.SphereGeometry(0.47, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), M(0xffcf4a), 0, 0.78, -0.02).scale.set(1, 0.9, 1.15);
      add(new THREE.BoxGeometry(0.5, 0.05, 0.12), ink, 0, 0.82, 0.42);
    } else if (kind === 'swim') { // bonnet + lunettes
      add(new THREE.SphereGeometry(0.47, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), pink, 0, 0.75, 0);
      for (const s of [-1, 1]) add(new THREE.TorusGeometry(0.09, 0.03, 8, 16), M(0x4dabf7), s * 0.16, 0.7, 0.47);
    } else if (kind === 'band') { // bandeau sport + maillot
      add(new THREE.TorusGeometry(0.44, 0.05, 10, 32), mint, 0, 0.85, 0, Math.PI / 2);
      bib(a, i);
    } else if (kind === 'scrum') { // casque de mêlée
      add(new THREE.SphereGeometry(0.46, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), M(0x2a1638), 0, 0.78, 0);
      for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.14, 0.14, 0.06, 16), M(0x2a1638), s * 0.46, 0.62, 0, 0, 0, Math.PI / 2);
    } else if (kind === 'mask') { // masque d'escrime + fleuret
      add(new THREE.SphereGeometry(0.4, 20, 14, -Math.PI / 2, Math.PI), M(0x1f2140, { wireframe: true }), 0, 0.62, 0.12);
      add(new THREE.CylinderGeometry(0.012, 0.012, 1.1, 6), M(0xc9d3e3, { metalness: 0.8 }), 0.55, 0.5, 0.35, 1.1, 0, 0);
    } else if (kind === 'visor') { // visière de golf
      add(new THREE.TorusGeometry(0.43, 0.04, 8, 32), white, 0, 0.88, 0, Math.PI / 2);
      add(new THREE.CylinderGeometry(0.32, 0.32, 0.03, 24, 1, false, -Math.PI / 2, Math.PI), M(0xffcf4a), 0, 0.88, 0.26);
    } else if (kind === 'podium') { // médaille
      add(new THREE.TorusGeometry(0.36, 0.02, 6, 24, Math.PI), pink, 0, 0.62, 0.15, Math.PI * 0.6, 0, Math.PI);
      add(new THREE.CylinderGeometry(0.11, 0.11, 0.03, 20), gold, 0, 0.4, 0.5, Math.PI / 2);
    } else { // lobby : bandeau aux couleurs du jeu
      add(new THREE.TorusGeometry(0.44, 0.05, 10, 32), pink, 0, 0.85, 0, Math.PI / 2);
    }
    return a;
  }
  function bib(a, i) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 48;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 64, 48);
    x.fillStyle = '#e8456b'; x.fillRect(0, 0, 64, 8);
    x.fillStyle = '#2a1638'; x.font = 'italic 900 30px sans-serif'; x.textAlign = 'center'; x.fillText(String(i + 1), 32, 42);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.26), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }));
    m.position.set(0, 0.42, 0.47); m.rotation.x = 0.25; a.add(m);
  }
  function dressAll() {
    let i = 0;
    for (const [id, m] of slimes) {
      const ACC = { haies: 'sprint', longueur: 'sprint', aviron: 'tir', basket: 'band', handball: 'band', football: 'band', cyclisme: 'helmet', skate: 'helmet', natation: 'swim', rugby: 'scrum', escrime: 'mask', golf: 'visor' };
      const kind = (event === 'final' || event === 'reveal') ? (top.includes(id) ? 'podium' : 'lobby') : (ACC[event] || event);
      const key = kind + ':' + i;
      if (m.userData.accFor !== key) {
        m.remove(m.userData.acc);
        m.userData.acc = accessory(kind, i); m.add(m.userData.acc); m.userData.accFor = key;
      }
      i++;
    }
  }
  function sync() {
    const list = S ? S.players : [];
    const ids = new Set(list.map((p) => p.id));
    for (const [id, m] of slimes) if (!ids.has(id)) { scene.remove(m); slimes.delete(id); }
    for (const p of list) {
      let m = slimes.get(p.id);
      const col = country(p.country).color;
      if (!m) { m = makeSlime(col); slimes.set(p.id, m); m.userData.col = col; }
      if (m.userData.col !== col) { m.userData.body.material.color.set(col); m.userData.col = col; }
    }
    if (!S) setEvent('home'); else if (S.phase === 'lobby') setEvent('lobby');
    dressAll(); layout();
  }
  const THEMES = { sprint: 0xffb6cf, haies: 0xffb6cf, longueur: 0xf3d9a4, tir: 0xb9ecd9, hauteur: 0xffd0a8, hiphop: 0xd9c8ff, curling: 0xeaf6ff, cyclisme: 0xe9b98a, natation: 0x7fd3f5, aviron: 0x5fb3e3, football: 0x7fd6a3, rugby: 0x9fe3b8, golf: 0x6fd3a8, basket: 0xe9b98a, handball: 0xe9b98a, escrime: 0xc9d3e3, skate: 0xc9d3e3 };
  function setEvent(e, t = []) {
    if (e !== event) progs = {};
    event = e; top = t;
    ground.material.color.set(THEMES[e] ?? 0xffb6cf);
    stadium.visible = false; // direction « affiche » : décor 3D épuré
    if (e === 'final') ground.material.color.set(0xffd6e3);
    deco.clear();
    if (e === 'curling') {
      [[3, 0x4dabf7], [2, 0xffffff], [1, 0xff6b9a]].forEach(([r, c], i) => {
        const d = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshBasicMaterial({ color: c }));
        d.rotation.x = -Math.PI / 2; d.position.set(0, 0.03 + i * 0.005, -6); deco.add(d);
      });
    }
    if (e === 'hauteur') {
      for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8), white); p.position.set(s * 2.5, 1.2, -5); deco.add(p); }
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 5, 8), pink); bar.rotation.z = Math.PI / 2; bar.position.set(0, 2.2, -5); deco.add(bar);
      const mat = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 2.5), M(0x2a1638)); mat.position.set(0, 0.25, -6.6); deco.add(mat);
    }
    if (e === 'tir') {
      for (let i = 0; i < 5; i++) {
        const tg = new THREE.Group();
        [[0.5, 0xffffff], [0.36, 0xf25c94], [0.22, 0xffffff], [0.1, 0x1f2140]].forEach(([r, c], k) => {
          const d = new THREE.Mesh(new THREE.CircleGeometry(r, 32), new THREE.MeshBasicMaterial({ color: c })); d.position.z = k * 0.002; tg.add(d);
        });
        tg.position.set((i - 2) * 1.4, 1.6, -7); deco.add(tg);
      }
    }
    if (e === 'final' || e === 'reveal') {
      [[0, 1.2, 0xffcf4a], [-1.5, 0.8, 0xc9d3e3], [1.5, 0.5, 0xe39a62]].forEach(([x, h, c]) => {
        const blk = new THREE.Mesh(new THREE.BoxGeometry(1.4, h, 1.2), M(c)); blk.position.set(x, h / 2, -1); deco.add(blk);
      });
    }
    dressAll(); layout();
  }
  function setProg(id, v) { progs[id] = v; if (event === 'sprint') layout(); }
  function cheer(id) { const m = slimes.get(id); if (m) m.userData.jump = 1; }
  function layout() {
    const arr = [...slimes.entries()];
    const n = arr.length;
    arr.forEach(([id, m], i) => {
      const t = m.userData.target;
      if (event === 'sprint') t.set((i - (n - 1) / 2) * 1.2, 0, -(progs[id] || 0) * 50);
      else if (event === 'final' || event === 'reveal') {
        const k = top.indexOf(id);
        const spots = [[0, 1.2], [-1.5, 0.8], [1.5, 0.5]];
        if (k >= 0) t.set(spots[k][0], spots[k][1], -1);
        else t.set(((i % 8) - 3.5) * 1.1, 0, 1.5 + Math.floor(i / 8) * 1.1);
      } else {
        // en ligne, comme sur une ligne de départ
        const perRow = 8, row = Math.floor(i / perRow), col = i % perRow, cnt = Math.min(perRow, n - row * perRow);
        t.set((col - (cnt - 1) / 2) * 1.15, 0, -row * 1.3);
      }
    });
  }
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  let last = performance.now();
  const camT = new THREE.Vector3(), look = new THREE.Vector3();
  function loop(t) {
    // la 3D n'est visible qu'au podium final : on ne calcule rien le reste du temps (batterie)
    if (document.body.dataset.phase !== 'final') { last = t; requestAnimationFrame(loop); return; }
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (event === 'sprint') { const me = slimes.get(pid); const z = me ? me.position.z : 0; camT.set(6, 2.5, z + 3); look.set(0, 0.5, z - 3); }
    else if (event === 'final' || event === 'reveal') { camT.set(0, 2.6, 6); look.set(0, 1, -1); }
    else { camT.set(Math.sin(t / 7000) * 1.5, 2.6, 6.5); look.set(0, 0.6, -1); }
    cam.position.lerp(camT, 1 - Math.exp(-dt * 3)); cam.lookAt(look);
    for (const [, m] of slimes) {
      const u = m.userData;
      m.position.x += (u.target.x - m.position.x) * (1 - Math.exp(-dt * (event === 'sprint' ? 8 : 3)));
      m.position.z += (u.target.z - m.position.z) * (1 - Math.exp(-dt * (event === 'sprint' ? 8 : 3)));
      u.phase += dt * (event === 'sprint' ? 14 : 4);
      const w = Math.sin(u.phase);
      u.body.scale.set(0.95 + w * 0.04, 0.95 - w * 0.05, 0.95 + w * 0.04);
      if (u.jump > 0) { u.jump -= dt * 0.8; m.position.y = u.target.y + Math.abs(Math.sin(u.jump * 12)) * 0.8; }
      else m.position.y = u.target.y + Math.max(0, w) * (event === 'final' ? 0.3 : 0.04);
      m.rotation.y = Math.atan2(cam.position.x - m.position.x, cam.position.z - m.position.z);
    }
    for (const f of stadium.children) if (f.userData.fan !== undefined) f.position.y += Math.sin(t / 250 + f.userData.fan) * dt * 0.6;
    renderer.render(scene, cam);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  return { sync, setEvent, setProg, cheer };
})();

// Démarrage
if (window.OFFLINE || typeof window.io !== 'function') { window.OFFLINE = true; socket = window.makeBotSocket(); bindSocket(socket); }
else { socket = window.io(); bindSocket(socket); }
render();
if ('serviceWorker' in navigator && !window.OFFLINE_ONLY && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
