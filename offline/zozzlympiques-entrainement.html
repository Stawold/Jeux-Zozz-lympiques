  await countdown(root);
  const start = performance.now();
  let hit = 0, pen = 0, done = false;
  const timer = setInterval(() => { if (!done) tEl.textContent = ((performance.now() - start) / 1000 + pen).toFixed(2) + ' s'; }, 50);
  const colors = ['#e8456b', '#2a1638', '#9ee6cf', '#f4b48a'];
  function spawn() {
    const r = ar.getBoundingClientRect();
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = 42 + Math.random() * (r.width - 84) + 'px';
    b.style.top = 42 + Math.random() * (r.height - 84) + 'px';
    b.style.setProperty('--c', colors[hit % colors.length]);
    b.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (done) return;
      const s = document.createElement('div');
      s.className = 'burst'; s.style.left = b.style.left; s.style.top = b.style.top;
      ar.appendChild(s); setTimeout(() => s.remove(), 300);
      b.remove(); sfx('pop'); buzz(15);
      hit++;
      nEl.textContent = `${hit} / ${TOTAL}`;
      ctx.prog(hit / TOTAL);
      if (hit >= TOTAL) {
        done = true;
        clearInterval(timer);
        const time = (performance.now() - start) / 1000 + pen;
        tEl.textContent = time.toFixed(2) + ' s';
        ctx.finish(-Math.round(time * 100) / 100, time.toFixed(2) + ' s');
      } else spawn();
    });
    ar.appendChild(b);
  }
  ar.addEventListener('pointerdown', () => { if (!done) { pen += 0.5; sfx('fail'); buzz(80); } });
  spawn();
}

/* ---------------- Saut en hauteur ---------------- */
async function hauteur(root, ctx) {
  root.innerHTML = `
    <div class="hud"><span class="big" id="h">1,50 m</span><span id="b">Meilleur : —</span></div>
    <div class="help">Tape quand la flèche est dans la zone verte. 3 échecs à une hauteur = éliminé.</div>
    <div class="gauge" id="g"><div class="zone" id="z"></div><div class="arrow" id="a"></div></div>
    <div class="tries" id="tr"></div>
    <div class="title" id="msg"></div>
    <button class="tapzone" id="tap" disabled>SAUTE</button>`;
  const z = $(root, '#z'), a = $(root, '#a'), tap = $(root, '#tap'), hEl = $(root, '#h'), bEl = $(root, '#b'), tr = $(root, '#tr'), msg = $(root, '#msg');
  let level = 0, fails = 0, totalFails = 0, best = 0, pos = 0, dir = 1, zStart = 0, zW = 0, running = false, done = false;
  const height = () => 150 + level * 10;
  const fmt = (cm) => (cm / 100).toFixed(2).replace('.', ',') + ' m';
  function setup() {
    zW = Math.max(4, 30 - level * 2.5);
    zStart = 5 + Math.random() * (90 - zW);
    z.style.left = zStart + '%'; z.style.width = zW + '%';
    hEl.textContent = fmt(height());
    tr.textContent = [0, 1, 2].map((i) => (i < fails ? '❌' : '⚪')).join('');
  }
  let lastT = performance.now();
  function loop(t) {
    const dt = (t - lastT) / 1000; lastT = t;
    if (running) {
      pos += dir * (55 + level * 6) * dt;
      if (pos > 100) { pos = 100; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
      a.style.left = pos + '%';
    }
    if (!done) requestAnimationFrame(loop);
  }
  setup();
  await countdown(root);
  running = true; tap.disabled = false;
  requestAnimationFrame(loop);
  tap.addEventListener('pointerdown', async (e) => {
    e.preventDefault();
    if (!running || done) return;
    running = false;
    const ok = pos >= zStart && pos <= zStart + zW;
    if (ok) {
      best = height(); bEl.textContent = 'Meilleur : ' + fmt(best);
      msg.textContent = '✅ Franchi !'; sfx('ok');
      level++; fails = 0;
    } else {
      fails++; totalFails++;
      msg.textContent = '❌ Barre tombée'; sfx('fail');
      if (navigator.vibrate) navigator.vibrate(120);
    }
    setup();
    if (fails >= 3) {
      done = true; tap.disabled = true;
      msg.textContent = best ? 'Fin ! ' + fmt(best) : 'Éliminé';
      ctx.finish(best * 100 - totalFails, best ? fmt(best) : '0 m');
      return;
    }
    await sleep(700);
    msg.textContent = '';
    pos = 0; dir = 1; running = true;
  });
}

/* ---------------- Hip-Hop ---------------- */
async function hiphop(root, ctx) {
  root.innerHTML = `
    <div class="hud"><span class="big" id="s">0 pts</span><span id="t">60 s</span></div>
    <canvas class="full" id="cv"></canvas>
    <div class="pads">
      <button data-l="0">⬅️</button><button class="alt" data-l="1">⬇️</button>
      <button class="alt" data-l="2">⬆️</button><button data-l="3">➡️</button>
    </div>`;
  const cv = $(root, '#cv'), sEl = $(root, '#s'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const ARROWS = ['⬅️', '⬇️', '⬆️', '➡️'];
  const COLS = ['#ff7eb6', '#8b5cf6', '#5ee0c8', '#ffe066'];
  const hitY = H - 50, lw = W / 4;
  let notes = [], score = 0, flash = [0, 0, 0, 0], label = '', labelT = 0, done = false;
  await countdown(root);
  const start = performance.now();
  let nextSpawn = 0, last = start;
  function press(l) {
    if (done) return;
    flash[l] = 1;
    let best = null, bd = 1e9;
    for (const n of notes) if (n.l === l && !n.hit) { const d = Math.abs(n.y - hitY); if (d < bd) { bd = d; best = n; } }
    if (best && bd < 22) { best.hit = true; score += 3; label = 'PARFAIT +3'; sfx('tick'); }
    else if (best && bd < 50) { best.hit = true; score += 1; label = 'BIEN +1'; }
    else label = 'RATÉ';
    labelT = 0.5;
    sEl.textContent = score + ' pts';
  }
  root.querySelectorAll('.pads button').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(+b.dataset.l); }));
  function frame(t) {
    const el = (t - start) / 1000, dt = (t - last) / 1000; last = t;
    const left = Math.max(0, 60 - el);
    tEl.textContent = Math.ceil(left) + ' s';
    const speed = 180 + el * 6; // px/s, accélère
    if (el < 58.5 && el >= nextSpawn) {
      notes.push({ l: Math.floor(Math.random() * 4), y: -30, hit: false });
      nextSpawn = el + Math.max(0.28, 0.9 - el * 0.011);
    }
    for (const n of notes) n.y += speed * dt;
    notes = notes.filter((n) => !n.hit && n.y < H + 40);
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(43,29,58,.55)'; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 4; i++) {
      g.fillStyle = `rgba(255,255,255,${0.05 + flash[i] * 0.3})`; g.fillRect(i * lw + 3, 0, lw - 6, H);
      flash[i] = Math.max(0, flash[i] - dt * 4);
    }
    g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, hitY); g.lineTo(W, hitY); g.stroke();
    g.font = `${Math.min(lw * 0.6, 40)}px serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const n of notes) {
      g.fillStyle = COLS[n.l]; g.beginPath(); g.arc(n.l * lw + lw / 2, n.y, Math.min(lw * 0.4, 28), 0, 7); g.fill();
    }
    if (labelT > 0) {
      labelT -= dt; g.fillStyle = '#fff'; g.font = '800 21px Unbounded, sans-serif';
      g.fillText(label, W / 2, H * 0.4);
    }
    if (left <= 0) {
      done = true;
      ctx.finish(score, score + ' pts');
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------------- Curling (duel) ---------------- */
async function curling(root, ctx) {
  const pair = ctx.current.pairs.find((p) => p.a === ctx.me || p.b === ctx.me);
  const oppId = pair.a === ctx.me ? pair.b : pair.a;
  const isBot = oppId === 'BOT';
  const oppName = isBot ? '🤖 Bot' : ctx.name(oppId);
  const myCol = ctx.color(ctx.me), oppCol = isBot ? '#888' : ctx.color(oppId);

  root.innerHTML = `
    <div class="hud"><span id="who">vs ${oppName}</span><span id="t">20 s</span></div>
    <div class="title" id="msg"></div>
    <canvas class="full" id="cv" style="background:#eef7ff"></canvas>
    <label class="curl-start" for="sx"><span>Départ</span><input id="sx" type="range" min="-30" max="30" value="0" step="1" disabled><span id="sxv">centre</span></label>
    <div class="help" id="help">Choisis ton point de départ, puis glisse vers le bas pour viser et doser la force.</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);

  // Monde : x ∈ [-40,40], y ∈ [-40, 380]. Maison centrée en (0,0).
  const SW = 40, R = 4, HOUSE = 20, A = 40, VMAX = 200, START = { x: 0, y: 360 };
  const sx = $(root, '#sx'), sxv = $(root, '#sxv');
  sx.addEventListener('input', () => { START.x = +sx.value; sxv.textContent = START.x === 0 ? 'centre' : (START.x < 0 ? '◀ ' : '') + Math.abs(START.x) + (START.x > 0 ? ' ▶' : ''); draw(); });
  const sc = Math.min(W / 88, H / 440);
  const ox = W / 2, oy = H / 2 - 170 * sc; // y monde 170 au centre
  const toS = (x, y) => [ox + x * sc, oy + y * sc];

  let stones = []; // {x,y,vx,vy,owner:'me'|'opp'}
  const order = [];
  const firstIsMe = pair.first === ctx.me;
  for (let i = 0; i < 6; i++) order.push((i % 2 === 0) === firstIsMe ? 'me' : 'opp');
  let turn = 0, sim = false, aiming = null, deadline = 0, ended = false, forfeit = false;
  const inbox = [], waiters = [];
  ctx.onMsg((d) => {
    if (d.type === 'left') { forfeit = true; endGame(true, 'forfait'); return; }
    inbox.push(d); while (waiters.length) waiters.shift()();
  });
  const nextMsg = (type, n) => new Promise((res) => {
    const check = () => {
      const i = inbox.findIndex((m) => m.type === type && m.n === n);
      if (i >= 0) return res(inbox.splice(i, 1)[0]);
      waiters.push(check);
    };
    check();
  });

  function draw() {
    g.clearRect(0, 0, W, H);
    // piste
    const [x0, y0] = toS(-SW, -40), [x1, y1] = toS(SW, 380);
    g.fillStyle = '#f7fbff'; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    g.strokeStyle = '#b8d4ea'; g.lineWidth = 2; g.strokeRect(x0, y0, x1 - x0, y1 - y0);
    // maison
    const [cx, cy] = toS(0, 0);
    [[HOUSE, '#4dabf7'], [HOUSE * 0.66, '#fff'], [HOUSE * 0.33, '#ff6b9a'], [3, '#fff']].forEach(([r, c]) => {
      g.fillStyle = c; g.beginPath(); g.arc(cx, cy, r * sc, 0, 7); g.fill();
    });
    g.strokeStyle = '#9ec3e0'; g.beginPath(); g.moveTo(x0, cy); g.lineTo(x1, cy); g.moveTo(cx, y0); g.lineTo(cx, y1); g.stroke();
    // ligne de lancer
    const [, hy] = toS(0, 300); g.strokeStyle = '#ff7eb6'; g.beginPath(); g.moveTo(x0, hy); g.lineTo(x1, hy); g.stroke();
    // pierres
    for (const s of stones) drawStone(s.x, s.y, s.owner === 'me' ? myCol : oppCol);
    if (!sim && !ended && order[turn] === 'me') {
      drawStone(START.x, START.y, myCol, 0.9);
      if (aiming) {
        const v = aimVel();
        if (v) {
          const [sx, sy] = toS(START.x, START.y);
          const k = v.p;
          g.strokeStyle = `hsl(${120 - k * 120},80%,45%)`; g.lineWidth = 4; g.setLineDash([8, 6]);
          g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + v.vx * sc * 0.9, sy + v.vy * sc * 0.9); g.stroke(); g.setLineDash([]);
        }
      }
    }
    // compteur pierres
    const left = (o) => order.slice(turn).filter((x) => x === o).length;
    g.fillStyle = '#2a1638'; g.font = '800 11px Unbounded, sans-serif'; g.textAlign = 'left';
    g.fillText(`Toi : ${left('me')} pierre(s)`, 8, H - 10);
    g.textAlign = 'right'; g.fillText(`${oppName} : ${left('opp')}`, W - 8, H - 10); g.textAlign = 'left';
  }
  function drawStone(x, y, col, alpha = 1) {
    const [sx, sy] = toS(x, y);
    g.globalAlpha = alpha;
    g.fillStyle = '#6c757d'; g.beginPath(); g.arc(sx, sy, R * sc, 0, 7); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(sx, sy, R * sc * 0.7, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(sx - R * sc * 0.25, sy - R * sc * 0.25, R * sc * 0.22, 0, 7); g.fill();
    g.globalAlpha = 1;
  }
  function aimVel() {
    if (!aiming) return null;
    let dx = aiming.sx - aiming.cx, dy = aiming.sy - aiming.cy; // tirer vers le bas = lancer vers le haut
    const len = Math.hypot(dx, dy);
    if (dy >= -2 || len < 8) return null;
    const p = Math.min(1, len / (H * 0.35));
    const ux = dx / len, uy = dy / len;
    return { vx: ux * p * VMAX, vy: uy * p * VMAX, p };
  }

  function step(dt) {
    let moving = false;
    for (const s of stones) {
      const v = Math.hypot(s.vx, s.vy);
      if (v > 0) {
        const nv = Math.max(0, v - A * dt);
        s.vx *= nv / v; s.vy *= nv / v;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (nv > 0) moving = true;
      }
    }
    for (let i = 0; i < stones.length; i++) for (let j = i + 1; j < stones.length; j++) {
      const a = stones[i], b = stones[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < 2 * R) {
        const nx = dx / d, ny = dy / d;
        const ov = 2 * R - d; a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2;
        const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel > 0) { a.vx -= rel * nx; a.vy -= rel * ny; b.vx += rel * nx; b.vy += rel * ny; moving = true; }
      }
    }
    stones = stones.filter((s) => Math.abs(s.x) < SW && s.y > -40 && s.y < 385);
    return moving;
  }
  async function simulate() {
    sim = true;
    let last = performance.now();
    await new Promise((res) => {
      function f(t) {
        let dt = Math.max(0, Math.min(0.05, (t - last) / 1000)); last = t;
        let moving = false;
        const sub = 4;
        for (let i = 0; i < sub; i++) moving = step(dt / sub) || moving;
        draw();
        if (moving && !ended) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
    for (const s of stones) { s.vx = 0; s.vy = 0; }
    sim = false;
  }
  const snapshot = () => stones.map((s) => ({ x: +s.x.toFixed(3), y: +s.y.toFixed(3), owner: s.owner }));
  const launch = (vx, vy, owner, x = 0) => stones.push({ x, y: START.y, vx, vy, owner });

  function myThrow() {
    return new Promise((res) => {
      msg.textContent = '🎯 À toi de lancer !';
      sx.disabled = false;
      deadline = performance.now() + 20000;
      const tick = setInterval(() => {
        const l = Math.max(0, Math.ceil((deadline - performance.now()) / 1000));
        tEl.textContent = l + ' s';
        if (l <= 0) { cleanup(); res({ vx: 0, vy: -100, x: START.x }); } // tir faible automatique
      }, 200);
      const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
      const down = (e) => { const [x, y] = pt(e); aiming = { sx: x, sy: y, cx: x, cy: y }; cv.setPointerCapture(e.pointerId); draw(); };
      const move = (e) => { if (!aiming) return; const [x, y] = pt(e); aiming.cx = x; aiming.cy = y; draw(); };
      const up = () => { const v = aimVel(); aiming = null; draw(); if (v) { cleanup(); res({ ...v, x: START.x }); } };
      function cleanup() { clearInterval(tick); cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move); cv.removeEventListener('pointerup', up); tEl.textContent = ''; sx.disabled = true; }
      cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move); cv.addEventListener('pointerup', up);
      if (ended) cleanup();
    });
  }
  function botThrow() {
    const tx = (Math.random() - 0.5) * 16, ty = (Math.random() - 0.5) * 16;
    const x = Math.round((Math.random() - 0.5) * 40);
    const dx = tx - x, dy = ty - START.y, d = Math.hypot(dx, dy);
    const v = Math.sqrt(2 * A * d) * (0.92 + Math.random() * 0.14);
    return { vx: dx / d * v, vy: dy / d * v, x };
  }

  function score() {
    const inHouse = stones.map((s) => ({ ...s, d: Math.hypot(s.x, s.y) })).filter((s) => s.d <= HOUSE + R).sort((a, b) => a.d - b.d);
    if (!inHouse.length) return { winner: null, pts: 0 };
    const w = inHouse[0].owner;
    const firstOther = inHouse.find((s) => s.owner !== w);
    const pts = inHouse.filter((s) => s.owner === w && (!firstOther || s.d < firstOther.d)).length;
    return { winner: w, pts };
  }
  function endGame(win, detail) {
    if (ended) return;
    ended = true;
    msg.textContent = win ? '🏆 Victoire !' : '😢 Défaite';
    $(root, '#help').textContent = detail;
    ctx.finish(win ? 1 : 0, detail);
  }

  draw();
  await sleep(600);
  let extra = 0;
  while (!ended) {
    while (turn < order.length && !ended) {
      const who = order[turn], n = turn;
      if (who === 'me') {
        const v = await myThrow();
        if (ended) break;
        msg.textContent = '';
        if (!isBot) ctx.send({ type: 'throw', n, vx: v.vx, vy: v.vy, x: v.x });
        launch(v.vx, v.vy, 'me', v.x);
        await simulate();
        if (!isBot) ctx.send({ type: 'sync', n, stones: snapshot().map((s) => ({ ...s, owner: s.owner === 'me' ? 'opp' : 'me' })) });
      } else {
        msg.textContent = `⏳ ${oppName} vise…`;
        let v;
        if (isBot) { await sleep(1200); v = botThrow(); }
        else v = await nextMsg('throw', n);
        if (ended) break;
        msg.textContent = '';
        launch(v.vx, v.vy, 'opp', v.x || 0);
        await simulate();
        if (!isBot) {
          const s = await nextMsg('sync', n);
          if (ended) break;
          stones = s.stones.map((o) => ({ ...o, vx: 0, vy: 0 }));
          draw();
        }
      }
      turn++;
    }
    if (ended) break;
    const r = score();
    if (r.winner) {
      endGame(r.winner === 'me', r.winner === 'me' ? `${r.pts}-0` : `0-${r.pts}`);
    } else {
      // égalité / maison vide : une pierre de plus chacun
      extra++;
      msg.textContent = '⚖️ Maison vide : une pierre de plus chacun !';
      await sleep(1500);
      order.push(firstIsMe ? 'me' : 'opp', firstIsMe ? 'opp' : 'me');
      if (extra > 5) endGame(firstIsMe, 'égalité');
    }
  }
}


// Jeux Zozz’lympiques — moteur de course partagé (vue de côté en haut, position en direct en bas)
// + les 5 courses : 100 m, 110 m haies, cyclisme sur piste, natation 4 nages, aviron.

const THEMES = {
  sprint:   { track: '#ffb6cf', line: '#ffffff', len: 100, marks: [25, 50, 75], unit: 'm' },
  haies:    { track: '#ffb6cf', line: '#ffffff', len: 110, marks: [], unit: 'm', hurdles: Array.from({ length: 10 }, (_, i) => 13.72 + i * 9.14) },
  cyclisme: { track: '#e9b98a', line: '#4a7bd6', len: 1000, marks: [250, 500, 750], unit: 'm', gear: 'bike' },
  natation: { track: '#7fd3f5', line: 'rope', len: 200, marks: [50, 100, 150], unit: 'm', gear: 'swim' },
  aviron:   { track: '#5fb3e3', line: 'rgba(255,255,255,.5)', len: 2000, marks: [500, 1000, 1500], unit: 'm', gear: 'boat' },
};

function drawSlime(g, cx, cy, r, color, gear, hop, t) {
  g.lineWidth = 2; g.strokeStyle = '#2a1638';
  if (gear === 'bike') { // deux roues sous le slime
    for (const s of [-1, 1]) {
      g.beginPath(); g.arc(cx + s * r * 0.9, cy + r * 0.55, r * 0.55, 0, 7); g.stroke();
      g.beginPath(); const a = t * 12; g.moveTo(cx + s * r * 0.9 + Math.cos(a) * r * 0.5, cy + r * 0.55 + Math.sin(a) * r * 0.5); g.lineTo(cx + s * r * 0.9 - Math.cos(a) * r * 0.5, cy + r * 0.55 - Math.sin(a) * r * 0.5); g.stroke();
    }
    hop = 0; cy -= r * 0.25;
  }
  if (gear === 'boat') { // coque + avirons
    g.fillStyle = '#fff1f5'; g.beginPath(); g.moveTo(cx - r * 1.8, cy + r * 0.5); g.lineTo(cx + r * 2, cy + r * 0.5); g.lineTo(cx + r * 1.4, cy + r * 0.9); g.lineTo(cx - r * 1.4, cy + r * 0.9); g.closePath(); g.fill(); g.stroke();
    const a = Math.sin(t * 6) * 0.6;
    g.beginPath(); g.moveTo(cx, cy + r * 0.3); g.lineTo(cx - Math.cos(a) * r * 1.8, cy + r * 0.9 + Math.sin(a) * r * 0.4); g.stroke();
    hop = 0;
  }
  if (gear === 'swim') { // seul le haut du corps dépasse de l'eau
    g.save(); g.beginPath(); g.rect(cx - r * 2, cy - r * 2, r * 4, r * 2.2); g.clip();
  }
  g.fillStyle = 'rgba(31,33,64,.2)'; if (!gear) { g.beginPath(); g.ellipse(cx, cy + r * 0.9, r, r * 0.25, 0, 0, 7); g.fill(); }
  g.fillStyle = color;
  g.beginPath(); g.ellipse(cx, cy - hop, r, r * 0.88, 0, 0, 7); g.fill(); g.stroke();
  if (gear === 'swim') { // bonnet + lunettes
    g.fillStyle = '#e8456b'; g.beginPath(); g.ellipse(cx, cy - hop - r * 0.35, r * 0.95, r * 0.55, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#ffd75e'; g.fillRect(cx + r * 0.15, cy - hop - r * 0.2, r * 0.5, r * 0.22);
    g.restore();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(cx - r * 1.3, cy, r * 0.3, Math.PI, 0); g.stroke();
    return;
  }
  if (gear === 'bike') { // casque profilé
    g.fillStyle = '#ffd75e'; g.beginPath(); g.ellipse(cx - r * 0.1, cy - r * 0.55, r * 0.95, r * 0.42, -0.15, Math.PI, 0); g.fill(); g.stroke();
  } else if (gear === 'boat') { // casquette
    g.fillStyle = '#2a1638'; g.beginPath(); g.ellipse(cx, cy - r * 0.5, r * 0.9, r * 0.4, 0, Math.PI, 0); g.fill(); g.fillRect(cx, cy - r * 0.55, r * 1.1, r * 0.12);
  } else { // bandeau
    g.fillStyle = '#fff'; g.fillRect(cx - r, cy - hop - r * 0.55, r * 2, r * 0.3);
    g.fillStyle = '#e8456b'; g.fillRect(cx - r, cy - hop - r * 0.47, r * 2, r * 0.12);
  }
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx + r * 0.4, cy - hop - r * 0.05, r * 0.22, 0, 7); g.fill();
  g.fillStyle = '#2a1638'; g.beginPath(); g.arc(cx + r * 0.48, cy - hop - r * 0.05, r * 0.11, 0, 7); g.fill();
}

// Crée l'écran partagé ; renvoie { ctl, advance(m), go(), meters, finished, trip() }
function raceScreen(root, ctx, kind) {
  const T = THEMES[kind];
  root.innerHTML = `
    <div class="split-top"><canvas id="race"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="m">0 m</span><span id="t">0.00 s</span></div>
      <div class="rank-row"><div class="pos p1" id="pos">1<sup>er</sup></div><div class="mini" id="mini"></div></div>
      <div class="ctl" id="ctl"></div>
    </div>`;
  const cv = $(root, '#race'), mEl = $(root, '#m'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const st = liveStandings(ctx, $(root, '#pos'), $(root, '#mini'));
  const shown = {};
  const R = { ctl: $(root, '#ctl'), meters: 0, finished: false, started: false, start: 0, tripT: 0, onFinish: null };
  let clock = 0;
  function draw(dt) {
    clock += dt;
    const n = ctx.players.length, top = 18, laneH = Math.min(46, (H - top - 16) / n);
    const x0 = 46, x1 = W - 16, X = (m) => x0 + (x1 - x0) * m / T.len;
    g.fillStyle = '#fff1f5'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#2a1638'; g.fillRect(0, 0, W, top - 4);
    for (let i = 0; i < W; i += 8) { g.fillStyle = ['#ffb6cf', '#9ee6cf', '#ffd75e', '#fff'][(i / 8) % 4]; g.fillRect(i + 2, 3 + ((i / 8 + Math.floor(clock * 4)) % 2) * 4, 4, 4); }
    g.fillStyle = T.track; g.fillRect(0, top, W, laneH * n);
    for (let i = 0; i <= n; i++) {
      const y = top + i * laneH;
      if (T.line === 'rope') { for (let x = 0; x < W; x += 8) { g.fillStyle = (x / 8) % 2 ? '#e8456b' : '#fff'; g.beginPath(); g.arc(x + 4, y, 2.5, 0, 7); g.fill(); } }
      else { g.strokeStyle = T.line; g.lineWidth = 2; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    }
    g.font = '800 10px Unbounded, sans-serif'; g.textAlign = 'center';
    for (const d of T.marks) { const x = X(d); g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(x - 1, top, 2, laneH * n); g.fillStyle = '#2a1638'; g.fillText(d + ' m', x, Math.min(H - 2, top + laneH * n + 12)); }
    if (T.hurdles) for (const h of T.hurdles) for (let i = 0; i < n; i++) {
      const x = X(h), y = top + i * laneH;
      g.fillStyle = '#fff'; g.fillRect(x - 1, y + laneH * 0.25, 2, laneH * 0.6); g.fillStyle = '#e8456b'; g.fillRect(x - 4, y + laneH * 0.25, 8, 3);
    }
    for (let y = top, k = 0; y < top + laneH * n; y += 6, k++) { g.fillStyle = k % 2 ? '#2a1638' : '#fff'; g.fillRect(x1, y, 6, 6); g.fillStyle = k % 2 ? '#fff' : '#2a1638'; g.fillRect(x1 + 6, y, 6, 6); }
    ctx.players.forEach((p, i) => {
      const target = ctx.progs[p.id] || 0;
      shown[p.id] = (shown[p.id] ?? 0) + (target - (shown[p.id] ?? 0)) * Math.min(1, dt * 10);
      const cy = top + i * laneH + laneH / 2, r = Math.min(laneH * 0.34, 14);
      const cx = X(shown[p.id] * T.len);
      const moving = target > 0 && target < 1;
      let hop = moving && !T.gear ? Math.abs(Math.sin(clock * 18 + i)) * r * 0.35 : 0;
      if (p.id === ctx.me) { g.fillStyle = 'rgba(242,92,148,.28)'; g.fillRect(0, top + i * laneH, W, laneH); }
      if (p.id === ctx.me && R.tripT > 0) { hop = 0; g.fillStyle = 'rgba(230,57,70,.5)'; g.beginPath(); g.arc(cx, cy, r * 1.6, 0, 7); g.fill(); }
      g.font = `${Math.min(laneH * 0.6, 18)}px serif`; g.textAlign = 'left'; g.fillText(p.flag, 4, cy + 6);
      // en natation, nage retour (50-100 et 150-200 m) : on reste en ligne, la vue est déroulée
      drawSlime(g, cx, cy, r, p.color, T.gear, hop, clock + i);
      if (p.id === ctx.me) { g.fillStyle = '#2a1638'; g.font = '900 9px Unbounded, sans-serif'; g.textAlign = 'left'; g.fillText('TOI', cx + r * 1.4 + 4, cy + 4); }
    });
    if (R.tripT > 0) R.tripT -= dt;
  }
  let last = performance.now();
  (function loop(t) { if (!root.isConnected) return; const dt = Math.max(0, Math.min(0.05, (t - last) / 1000)); last = t; draw(dt); st.update(); requestAnimationFrame(loop); })(last);
  const timer = setInterval(() => { if (!root.isConnected) return clearInterval(timer); if (R.started && !R.finished) tEl.textContent = ((performance.now() - R.start) / 1000).toFixed(2) + ' s'; }, 50);
  R.go = async () => { await countdown(root); R.started = true; R.start = performance.now(); };
  R.advance = (m) => {
    if (!R.started || R.finished) return;
    R.meters = Math.min(T.len, R.meters + m);
    mEl.textContent = Math.floor(R.meters) + ' m';
    ctx.prog(R.meters / T.len);
    if (R.meters >= T.len) {
      R.finished = true;
      const time = (performance.now() - R.start) / 1000;
      tEl.textContent = time.toFixed(2) + ' s';
      if (R.onFinish) R.onFinish();
      ctx.finish(-Math.round(time * 100) / 100, time.toFixed(2) + ' s');
    }
  };
  R.trip = () => { R.tripT = 0.6; if (navigator.vibrate) navigator.vibrate(150); };
  R.len = T.len;
  return R;
}

// Limiteur anti-triche : max n actions par seconde
const limiter = (n) => { let rec = []; return () => { const now = performance.now(); rec = rec.filter((t) => now - t < 1000); if (rec.length >= n) return false; rec.push(now); return true; }; };

/* ---------- 100 m ---------- */
async function sprint(root, ctx) {
  const R = raceScreen(root, ctx, 'sprint');
  R.ctl.innerHTML = `<button class="tapzone" id="tap" disabled>TAP</button>`;
  const tap = $(root, '#tap'), ok = limiter(15);
  await R.go(); tap.disabled = false;
  tap.addEventListener('pointerdown', (e) => { e.preventDefault(); if (ok()) R.advance(1); });
  R.onFinish = () => { tap.disabled = true; };
}

/* ---------- 110 m haies ---------- */
async function haies(root, ctx) {
  const R = raceScreen(root, ctx, 'haies');
  R.ctl.innerHTML = `<div class="duo"><button class="tapzone" id="tap" disabled>TAP</button><button class="jump" id="jump" disabled>SAUT</button></div>
    <div class="help" id="hint">Prochaine haie : 13,7 m</div>`;
  const tap = $(root, '#tap'), jump = $(root, '#jump'), hint = $(root, '#hint'), ok = limiter(15);
  const H = THEMES.haies.hurdles;
  let air = 0, slow = 0, next = 0;
  await R.go(); tap.disabled = jump.disabled = false;
  const lockZone = () => next < H.length && H[next] - R.meters < 2.5 && air <= 0;
  const refresh = () => {
    const locked = lockZone();
    tap.classList.toggle('locked', locked); jump.classList.toggle('callout', locked);
    tap.textContent = locked ? '⛔' : 'TAP';
    if (locked) { hint.textContent = '⚠️ HAIE ! Appuie sur SAUT'; hint.style.background = 'var(--gold)'; }
  };
  tap.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (lockZone()) { refresh(); return; } // course bloquée devant la haie : il faut sauter
    if (!ok()) return;
    const step = slow > 0 ? 0.45 : 1;
    if (slow > 0) slow--;
    const before = R.meters;
    R.advance(step);
    if (air > 0) air -= step;
    while (next < H.length && before < H[next] && R.meters >= H[next]) {
      if (air <= 0) { slow = 12; R.trip(); sfx('fail'); hint.textContent = '💥 Haie renversée ! Tu ralentis…'; }
      next++;
    }
    if (next < H.length) {
      const d = H[next] - R.meters;
      if (slow <= 0) hint.textContent = d < 3 ? '⚠️ SAUTE !' : `Prochaine haie : ${d.toFixed(1).replace('.', ',')} m`;
      hint.style.background = d < 3 ? 'var(--gold)' : '';
    } else { hint.textContent = 'Dernière ligne droite !'; hint.style.background = ''; }
    refresh();
  });
  jump.addEventListener('pointerdown', (e) => { e.preventDefault(); if (air <= 0) { air = 3.2; hint.textContent = '🦘 En l\'air ! Continue de taper'; hint.style.background = ''; } refresh(); });
  R.onFinish = () => { tap.disabled = jump.disabled = true; };
}

/* ---------- Cyclisme sur piste (1 km) : faire tourner la roue ---------- */
async function cyclisme(root, ctx) {
  const R = raceScreen(root, ctx, 'cyclisme');
  R.ctl.innerHTML = `<div class="wheel" id="wh"><div class="spokes" id="sp"></div><span>Fais des cercles</span></div>`;
  const wh = $(root, '#wh'), sp = $(root, '#sp');
  const PER_TURN = 25; // 1 tour de doigt = 25 m, 40 tours pour 1 km
  let lastA = null, rot = 0, recent = [];
  await R.go();
  const angle = (e) => { const r = wh.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); };
  wh.addEventListener('pointerdown', (e) => { wh.setPointerCapture(e.pointerId); lastA = angle(e); });
  wh.addEventListener('pointermove', (e) => {
    if (lastA === null || !R.started) return;
    const a = angle(e); let d = a - lastA; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; lastA = a;
    const now = performance.now();
    recent = recent.filter((x) => now - x.t < 1000); recent.push({ t: now, d: Math.abs(d) });
    const speed = recent.reduce((s, x) => s + x.d, 0) / (2 * Math.PI); // tours/s
    if (speed > 8) return; // plafond : 8 tours/s
    rot += d; sp.style.transform = `rotate(${rot}rad)`;
    R.advance(Math.abs(d) / (2 * Math.PI) * PER_TURN);
  });
  const up = () => { lastA = null; };
  wh.addEventListener('pointerup', up); wh.addEventListener('pointercancel', up);
}

/* ---------- Natation 4 × 50 m ---------- */
async function natation(root, ctx) {
  const R = raceScreen(root, ctx, 'natation');
  const multi = (navigator.maxTouchPoints || 0) >= 2;
  const SEG = [
    { name: 'Papillon', kind: 'circle', how: multi ? '2 doigts : fais tourner (cercles)' : 'Fais des cercles', need: 16 },
    { name: 'Dos', kind: 'lr', how: multi ? '2 doigts : gauche ↔ droite' : 'Glisse gauche ↔ droite', need: 16 },
    { name: 'Brasse', kind: 'ud', how: multi ? '2 doigts : haut ↕ bas' : 'Glisse haut ↕ bas', need: 16 },
    { name: 'Crawl', kind: 'tap', how: 'Tape vite sur la zone', need: 40 },
  ];
  R.ctl.innerHTML = `<div class="segbar" id="sb">${SEG.map((s, i) => `<span data-i="${i}">${s.name}</span>`).join('')}</div>
    <div class="swimzone" id="sz"><b id="sh"></b></div>`;
  const sz = $(root, '#sz'), sh = $(root, '#sh'), sb = $(root, '#sb');
  const seg = () => Math.min(3, Math.floor(R.meters / 50));
  function label() { const s = SEG[seg()]; sh.textContent = s.how; sb.querySelectorAll('span').forEach((x) => x.classList.toggle('on', +x.dataset.i === seg())); }
  label();
  await R.go();
  const ok = limiter(15);
  const pts = new Map(); // pointeurs actifs
  let ext = null, dir = 0, angAcc = 0, lastAng = null;
  const stroke = () => { const s = seg(); R.advance(50 / SEG[s].need); if (seg() !== s) { ext = null; angAcc = 0; lastAng = null; } label(); };
  sz.addEventListener('pointerdown', (e) => {
    e.preventDefault(); sz.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (SEG[seg()].kind === 'tap' && R.started && ok()) stroke();
  });
  sz.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId) || !R.started) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const s = seg(), kind = SEG[s].kind; if (kind === 'tap') return;
    const need = multi ? 2 : 1;
    if (pts.size < need) return;
    const arr = [...pts.values()];
    const avg = { x: arr.reduce((a, p) => a + p.x, 0) / arr.length, y: arr.reduce((a, p) => a + p.y, 0) / arr.length };
    if (kind === 'ud' || kind === 'lr') { // aller-retour
      const v = kind === 'ud' ? avg.y : avg.x;
      if (ext === null) { ext = v; return; }
      const d = v - ext;
      if (dir !== 0 && Math.sign(d) === dir) ext = v; // on prolonge le geste
      else if (Math.abs(d) > 45) { dir = Math.sign(d); ext = v; stroke(); } // demi-tour = un mouvement
    } else { // rotation
      let a;
      if (multi) a = Math.atan2(arr[1].y - arr[0].y, arr[1].x - arr[0].x);
      else { const r = sz.getBoundingClientRect(); a = Math.atan2(avg.y - (r.top + r.height / 2), avg.x - (r.left + r.width / 2)); }
      if (lastAng !== null) { let d = a - lastAng; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; angAcc += Math.abs(d); }
      lastAng = a;
      while (angAcc >= Math.PI && !R.finished) { angAcc -= Math.PI; stroke(); }
    }
  });
  const up = (e) => { pts.delete(e.pointerId); lastAng = null; };
  sz.addEventListener('pointerup', up); sz.addEventListener('pointercancel', up);
}

/* ---------- Aviron 2000 m : coups de rame vers le bas, en rythme ---------- */
async function aviron(root, ctx) {
  const R = raceScreen(root, ctx, 'aviron');
  R.ctl.innerHTML = `<div class="rowzone" id="rz"><div class="oar l"></div><div class="oar r"></div><b id="rh">Tire vers le bas ⬇ en rythme</b></div>`;
  const rz = $(root, '#rz'), rh = $(root, '#rh');
  await R.go();
  let y0 = null, lastStroke = 0;
  rz.addEventListener('pointerdown', (e) => { rz.setPointerCapture(e.pointerId); y0 = e.clientY; });
  rz.addEventListener('pointermove', (e) => {
    if (y0 === null || !R.started) return;
    if (e.clientY - y0 > 70) {
      y0 = null;
      const now = performance.now(), gap = now - lastStroke; lastStroke = now;
      const good = gap >= 380; // trop rapide = coup raté
      R.advance(good ? 50 : 18);
      rh.textContent = good ? '💪 Bon coup !' : '🌊 Trop vite, garde le rythme';
      rz.classList.remove('pull'); void rz.offsetWidth; rz.classList.add('pull');
    }
  });
  rz.addEventListener('pointerup', () => { y0 = null; });
}

// Jeux Zozz’lympiques — épreuves solo : saut en longueur, skateboard, basketball, rugby, mini-golf

const fmtM = (cm) => (cm / 100).toFixed(2).replace('.', ',') + ' m';

/* ---------------- Saut en longueur (2 phases bien distinctes) ---------------- */
async function longueur(root, ctx) {
  root.innerHTML = `
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="b">Meilleur : —</span><span id="tr">Essai 1/3</span></div>
      <div class="phase ph-wait" id="ph">Prépare-toi</div>
      <div class="help" id="msg">&nbsp;</div>
      <div class="runbar" id="rb"><i id="rbi"></i></div>
      <div class="gauge" id="gg" hidden><div class="zone" style="left:60%;width:20%"></div><div class="foul"></div><div class="arrow" id="a" style="left:0"></div></div>
      <button class="tapzone" id="tap" disabled>…</button>
    </div>`;
  const cv = $(root, '#cv'), tap = $(root, '#tap'), msg = $(root, '#msg'), a = $(root, '#a'), bEl = $(root, '#b'), trEl = $(root, '#tr');
  const ph = $(root, '#ph'), rb = $(root, '#rb'), rbi = $(root, '#rbi'), gg = $(root, '#gg');
  const { g, W, H } = fitCanvas(cv);
  const PIT0 = 0.42, M = (m) => W * PIT0 + (m / 10) * W * 0.55;
  let runX = 10, jump = null, marks = [], best = 0;
  const phase = (cls, txt, sub) => { ph.className = 'phase ph-' + cls; ph.textContent = txt; msg.textContent = sub || ' '; };
  function draw(t) {
    if (!root.isConnected) return;
    g.fillStyle = '#fff1f5'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    const gy = H * 0.72;
    g.fillStyle = '#ffb6cf'; g.fillRect(0, gy, W * PIT0, H - gy);
    g.fillStyle = '#f3d9a4'; g.fillRect(W * PIT0 + 6, gy, W * 0.56, H - gy);
    g.fillStyle = '#fff'; g.fillRect(W * PIT0 - 6, gy, 12, 6);
    g.fillStyle = '#e63946'; g.fillRect(W * PIT0 + 4, gy, 3, 6);
    g.font = '800 10px Unbounded, sans-serif'; g.textAlign = 'center';
    for (const m of [6, 7, 8, 9]) { g.fillStyle = '#2a1638'; g.fillRect(M(m) - 1, gy, 2, 10); g.fillText(m + ' m', M(m), gy + 22); }
    g.fillStyle = '#ffd75e'; g.fillRect(M(8.95) - 2, gy - 34, 4, 34); g.fillStyle = '#2a1638'; g.fillText('RM 8,95', M(8.95), gy - 38);
    g.fillText('PLANCHE', W * PIT0, gy + 22);
    for (const mk of marks) { g.fillStyle = mk.foul ? '#e63946' : '#2a1638'; g.beginPath(); g.arc(M(mk.d), gy + 3, 4, 0, 7); g.fill(); }
    let x = runX, y = gy - 16;
    if (jump) {
      const k = Math.min(1, (t - jump.t0) / 900);
      x = W * PIT0 + (M(jump.d) - W * PIT0) * k; y = gy - 16 - Math.sin(k * Math.PI) * H * 0.35;
      if (k >= 1 && !jump.done) { jump.done = true; marks.push({ d: jump.d, foul: jump.foul }); }
    }
    slime(g, x, y, 15, ctx.color(ctx.me));
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  for (let attempt = 1; attempt <= 3; attempt++) {
    trEl.textContent = `Essai ${attempt}/3`;
    jump = null; runX = 10;
    // PHASE 1 : élan
    rb.hidden = false; gg.hidden = true; rbi.style.transition = 'none'; rbi.style.transform = 'scaleX(1)';
    tap.className = 'tapzone'; tap.textContent = 'COURS !'; tap.disabled = false;
    phase('run', '① Élan : tape vite !', 'Tape le plus vite possible jusqu\'à la fin de la barre');
    let taps = 0, rec = [];
    const onTap = (e) => { e.preventDefault(); const n = performance.now(); rec = rec.filter((x) => n - x < 1000); if (rec.length >= 15) return; rec.push(n); taps++; runX = Math.min(W * PIT0 - 20, 10 + taps * (W * PIT0 / 34)); };
    tap.addEventListener('pointerdown', onTap);
    requestAnimationFrame(() => { rbi.style.transition = 'transform 2.5s linear'; rbi.style.transform = 'scaleX(0)'; });
    await sleep(2500);
    tap.removeEventListener('pointerdown', onTap);
    const speed = Math.min(1, taps / 30);
    // transition : stop
    tap.disabled = true; tap.textContent = 'STOP';
    phase('wait', '✋ Stop ! Arrivée sur la planche', `Vitesse d'élan : ${Math.round(speed * 100)} %`);
    await sleep(1200);
    // PHASE 2 : appel
    rb.hidden = true; gg.hidden = false;
    tap.className = 'tapzone jumpbtn'; tap.textContent = 'SAUTE !'; tap.disabled = false;
    phase('jump', '② Appel : saute !', 'Tape quand la flèche est dans le vert, le plus près possible du rouge');
    let pos = 0, dir = 1, stop = false, lt = performance.now();
    const sweep = (t) => { if (stop || !root.isConnected) return; const dt = Math.max(0, (t - lt) / 1000); lt = t; pos += dir * 110 * dt; if (pos > 100) { pos = 100; dir = -1; } if (pos < 0) { pos = 0; dir = 1; } a.style.left = pos + '%'; requestAnimationFrame(sweep); };
    requestAnimationFrame(sweep);
    const p = await new Promise((res) => { const h = (e) => { e.preventDefault(); tap.removeEventListener('pointerdown', h); res(pos); }; tap.addEventListener('pointerdown', h); setTimeout(() => res(pos), 6000); });
    stop = true; tap.disabled = true;
    const foul = p > 80;
    const acc = Math.max(0, Math.min(1, 1 - (80 - p) / 40));
    const d = foul ? 0 : Math.round((3 + 6.2 * speed * (0.55 + 0.45 * acc)) * 100) / 100;
    jump = { t0: performance.now(), d: foul ? 3 : d, foul };
    await sleep(1000);
    if (foul) { phase('wait', '🚩 Mordu !', 'Essai nul'); sfx('whistle'); }
    else { phase('wait', '📏 ' + fmtM(d * 100), d * 100 > best ? 'Meilleur saut !' : ''); if (d * 100 > best) { best = Math.round(d * 100); bEl.textContent = 'Meilleur : ' + fmtM(best); } }
    await sleep(1500);
  }
  ctx.finish(best, best ? fmtM(best) : 'Nul');
}

/* ---------------- Skateboard : séquences à reproduire ---------------- */
async function skate(root, ctx) {
  const TRICKS = ['Ollie', 'Kickflip', 'Heelflip', '360 Flip', 'Impossible', 'Darkslide'];
  const AR = ['⬅️', '⬇️', '⬆️', '➡️'];
  root.innerHTML = `
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
      <div class="hud"><span class="big" id="s">0 pts</span><span id="t">Figure 1/6</span></div>
      <div class="help" id="msg">Mémorise la séquence…</div>
      <div class="seq" id="seq"></div>
      <div class="pads">${AR.map((x, i) => `<button class="${i % 3 ? 'alt' : ''}" data-l="${i}" disabled>${x}</button>`).join('')}</div>
    </div>`;
  const cv = $(root, '#cv'), seqEl = $(root, '#seq'), msg = $(root, '#msg'), sEl = $(root, '#s'), tEl = $(root, '#t');
  const pads = [...root.querySelectorAll('.pads button')];
  const { g, W, H } = fitCanvas(cv);
  let trick = null, score = 0;
  function draw(t) {
    if (!root.isConnected) return;
    g.fillStyle = '#fff1f5'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    // half-pipe
    const gy = H * 0.8;
    g.fillStyle = '#c9d3e3'; g.beginPath(); g.moveTo(0, H * 0.3); g.quadraticCurveTo(0, gy, W * 0.25, gy); g.lineTo(W * 0.75, gy); g.quadraticCurveTo(W, gy, W, H * 0.3); g.lineTo(W, H); g.lineTo(0, H); g.fill();
    g.strokeStyle = '#2a1638'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, H * 0.3); g.quadraticCurveTo(0, gy, W * 0.25, gy); g.lineTo(W * 0.75, gy); g.quadraticCurveTo(W, gy, W, H * 0.3); g.stroke();
    let x = W / 2 + Math.sin(t / 900) * W * 0.18, y = gy - 22, rot = 0;
    if (trick) { const k = Math.min(1, (t - trick.t0) / 1100); y -= Math.sin(k * Math.PI) * H * 0.4; rot = trick.ok ? k * Math.PI * 2 : Math.sin(k * 20) * 0.3; if (k >= 1) trick = null; }
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = '#e8456b'; g.fillRect(-20, 14, 40, 5); g.fillStyle = '#2a1638'; g.beginPath(); g.arc(-13, 22, 3, 0, 7); g.arc(13, 22, 3, 0, 7); g.fill();
    g.restore();
    slime(g, x, y, 14, ctx.color(ctx.me));
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  await countdown(root);
  for (let f = 0; f < 6; f++) {
    const len = f + 3, seq = Array.from({ length: len }, () => Math.floor(Math.random() * 4));
    tEl.textContent = `Figure ${f + 1}/6 · ${TRICKS[f]}`;
    seqEl.innerHTML = seq.map(() => '<span>?</span>').join('');
    const slots = [...seqEl.children];
    pads.forEach((p) => (p.disabled = true));
    msg.textContent = '👀 Mémorise la séquence…';
    msg.textContent = '👀 Attention… mémorise la séquence';
    await sleep(1200);
    for (let i = 0; i < len; i++) {
      slots[i].textContent = AR[seq[i]]; slots[i].className = 'show';
      await sleep(Math.max(650, 950 - f * 50));
      slots[i].className = 'seen';
    }
    msg.textContent = '👀 Dernier coup d\'œil…';
    await sleep(1300);
    slots.forEach((x) => { x.textContent = '?'; x.className = ''; });
    msg.textContent = '🛹 À toi ! 10 secondes';
    pads.forEach((p) => (p.disabled = false));
    const res = await new Promise((resolve) => {
      let i = 0; const t0 = performance.now();
      const iv = setInterval(() => { const left = 10 - (performance.now() - t0) / 1000; msg.textContent = `🛹 À toi ! ${Math.max(0, left).toFixed(1)} s`; if (left <= 0) done(false, 0); }, 100);
      const h = (e) => {
        e.preventDefault();
        const l = +e.currentTarget.dataset.l;
        if (l === seq[i]) { slots[i].textContent = AR[l]; slots[i].className = 'ok'; i++; if (i === len) done(true, 10 - (performance.now() - t0) / 1000); }
        else { slots[i].textContent = AR[l]; slots[i].className = 'ko'; done(false, 0); }
      };
      pads.forEach((p) => p.addEventListener('pointerdown', h));
      function done(ok, left) { clearInterval(iv); pads.forEach((p) => { p.removeEventListener('pointerdown', h); p.disabled = true; }); resolve({ ok, left }); }
    });
    trick = { t0: performance.now(), ok: res.ok };
    if (res.ok) { sfx('ok'); const pts = 100 + Math.round(res.left * 5); score += pts; msg.textContent = `✅ ${TRICKS[f]} réussi ! +${pts}`; }
    else msg.textContent = `❌ ${TRICKS[f]} raté`;
    sEl.textContent = score + ' pts';
    await sleep(1300);
  }
  ctx.finish(score, score + ' pts');
}

/* ---------------- Basketball (lancers francs) & Rugby (pénalités) : jeu d'adresse ---------------- */
// Glisse le ballon vers la cible : la direction vise, la vitesse du geste donne la force.
async function kickGame(root, ctx, mode) {
  const rugby = mode === 'rugby';
  const N = 5;
  const SPOTS = rugby
    ? [{ x: 0.5, d: 22 }, { x: 0.32, d: 28 }, { x: 0.68, d: 32 }, { x: 0.25, d: 38 }, { x: 0.72, d: 45 }]
    : [{ x: 0.5 }, { x: 0.3 }, { x: 0.7 }, { x: 0.38 }, { x: 0.64 }];
  root.innerHTML = `
    <div class="hud"><span class="big" id="s">0 / ${N}</span><span id="t">${rugby ? 'Pénalité' : 'Lancer'} 1/${N}</span></div>
    <canvas class="full" id="cv"></canvas>
    <div class="help" id="msg">Glisse ${rugby ? 'le ballon' : 'la balle'} vers ${rugby ? 'les perches' : 'le panier'}. Plus ton geste est rapide, plus le tir est fort.</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), sEl = $(root, '#s'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  let made = 0, shot = 0, trail = [], fly = null, grab = false;
  const target = () => ({ x: W * (rugby ? SPOTS[shot].x : 0.5), y: H * (rugby ? 0.22 : 0.24) });
  const ballPos = () => ({ x: W * (rugby ? 0.5 : SPOTS[shot].x), y: H * 0.84 });
  // force = vitesse du geste en « hauteurs d'écran par seconde »
  const window_ = () => (rugby ? [1.4 + SPOTS[shot].d / 30, 9] : [1.7, 3.4]);
  const halfW = () => (rugby ? Math.max(14, 46 - SPOTS[shot].d * 0.6) : 18);
  function draw(t) {
    if (!root.isConnected) return;
    g.fillStyle = rugby ? '#bfeccb' : '#fff1f5'; g.fillRect(0, 0, W, H); stands(g, W, 14);
    const T = target();
    if (rugby) {
      g.strokeStyle = '#fff'; g.lineWidth = 2; for (let k = 1; k < 5; k++) { g.beginPath(); g.moveTo(0, H * k / 5); g.lineTo(W, H * k / 5); g.stroke(); }
      g.strokeStyle = '#2a1638'; g.lineWidth = 5; const hw = halfW();
      g.beginPath(); g.moveTo(T.x - hw, T.y - 55); g.lineTo(T.x - hw, T.y + 40); g.moveTo(T.x + hw, T.y - 55); g.lineTo(T.x + hw, T.y + 40); g.moveTo(T.x - hw, T.y + 18); g.lineTo(T.x + hw, T.y + 18); g.stroke();
      g.fillStyle = 'rgba(46,196,143,.25)'; g.fillRect(T.x - hw, T.y - 55, hw * 2, 73);
      g.fillStyle = '#2a1638'; g.font = '900 13px Unbounded, sans-serif'; g.textAlign = 'center'; g.fillText(SPOTS[shot].d + ' m', W / 2, H * 0.97);
    } else {
      g.fillStyle = '#e9b98a'; g.fillRect(0, H * 0.6, W, H * 0.4);
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(W / 2, H * 0.6, W * 0.3, 0, Math.PI); g.stroke();
      g.fillStyle = '#fff'; g.strokeStyle = '#2a1638'; g.lineWidth = 3; g.fillRect(T.x - 45, T.y - 60, 90, 60); g.strokeRect(T.x - 45, T.y - 60, 90, 60); g.strokeStyle = '#e8456b'; g.strokeRect(T.x - 18, T.y - 34, 36, 26);
      g.strokeStyle = '#e8456b'; g.lineWidth = 4; g.beginPath(); g.ellipse(T.x, T.y, 22, 6, 0, 0, 7); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1; for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(T.x + k * 8, T.y + 4); g.lineTo(T.x + k * 5, T.y + 24); g.stroke(); }
    }
    const B = ballPos();
    slime(g, B.x - 34, B.y + 6, 16, ctx.color(ctx.me));
    let bx = B.x, by = B.y, br = 13;
    if (fly) {
      const k = Math.min(1, (t - fly.t0) / 850);
      bx = B.x + (fly.x - B.x) * k; by = B.y + (fly.y - B.y) * k - Math.sin(k * Math.PI) * H * 0.22; br = 13 - k * 5;
      if (k >= 1 && !fly.done) { fly.done = true; fly.res(); }
    } else if (grab && trail.length) { bx = trail[trail.length - 1].x; by = trail[trail.length - 1].y; }
    if (grab && trail.length > 1) { g.strokeStyle = 'rgba(31,33,64,.35)'; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.moveTo(trail[0].x, trail[0].y); for (const p of trail) g.lineTo(p.x, p.y); g.stroke(); }
    if (!fly && !grab) { g.strokeStyle = 'rgba(242,92,148,.6)'; g.lineWidth = 3; g.beginPath(); g.arc(B.x, B.y, 22 + Math.sin(t / 200) * 3, 0, 7); g.stroke(); }
    if (rugby) { g.fillStyle = '#fff1f5'; g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.ellipse(bx, by, br, br * 0.7, -0.6, 0, 7); g.fill(); g.stroke(); }
    else { g.fillStyle = '#ff9f1c'; g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill(); g.stroke(); g.beginPath(); g.moveTo(bx - br, by); g.lineTo(bx + br, by); g.stroke(); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
  await countdown(root);
  for (shot = 0; shot < N; shot++) {
    tEl.textContent = `${rugby ? 'Pénalité' : 'Lancer'} ${shot + 1}/${N}`;
    msg.textContent = `Glisse ${rugby ? 'le ballon' : 'la balle'} vers ${rugby ? 'les perches' : 'le panier'} d'un geste vif.`;
    const v = await new Promise((res) => {
      const down = (e) => { const p = pt(e), B = ballPos(); if (Math.hypot(p.x - B.x, p.y - B.y) > 70) return; grab = true; trail = [p]; cv.setPointerCapture(e.pointerId); };
      const move = (e) => { if (!grab) return; trail.push(pt(e)); if (trail.length > 30) trail.shift(); };
      const up = () => {
        if (!grab) return; grab = false;
        // on mesure la fin du geste (les 120 dernières ms)
        const end = trail[trail.length - 1];
        const recent = trail.filter((p) => end.t - p.t <= 120);
        const st = recent[0];
        const dx = end.x - st.x, dy = end.y - st.y, dt = Math.max(16, end.t - st.t);
        trail = [];
        if (dy > -15) { msg.textContent = 'Glisse vers le haut, vers la cible !'; return; }
        cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move); cv.removeEventListener('pointerup', up);
        const speed = Math.hypot(dx, dy) / dt * 1000 / H; // hauteurs d'écran / s
        const B = ballPos(), T = target();
        const crossX = B.x + dx / dy * (T.y - B.y); // où la trajectoire croise la cible
        res({ speed, crossX });
      };
      cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move); cv.addEventListener('pointerup', up);
    });
    const T = target(), off = v.crossX - T.x, [lo, hi] = window_();
    const okAim = Math.abs(off) < halfW();
    const okPow = v.speed >= lo && v.speed <= hi;
    const ok = okAim && okPow;
    const fy = T.y + (rugby ? -30 : 0) + (okPow ? 0 : v.speed < lo ? 70 : -55);
    await new Promise((res) => (fly = { t0: performance.now(), x: T.x + Math.max(-W, Math.min(W, off)), y: fy, res }));
    if (ok) { made++; sfx('ok'); buzz(40); msg.textContent = rugby ? '✅ Transformée !' : '✅ Panier !'; } else { sfx('fail'); msg.textContent = '❌ ' + (!okPow ? (v.speed < lo ? 'Trop court : geste plus rapide !' : 'Trop fort : geste plus doux !') : off < 0 ? 'Trop à gauche' : 'Trop à droite'); }
    sEl.textContent = `${made} / ${N}`;
    await sleep(1300); fly = null;
  }
  ctx.finish(made, `${made}/${N}`);
}
const basket = (root, ctx) => kickGame(root, ctx, 'basket');
const rugby = (root, ctx) => kickGame(root, ctx, 'rugby');

/* ---------------- Mini-golf (3 trous) ---------------- */
async function golf(root, ctx) {
  const ALL = [
    { name: 'Le Tout-Droit', s: [50, 145], h: [50, 25], walls: [[28, 72, 44, 7]] },
    { name: 'La Chicane', s: [18, 148], h: [82, 28], walls: [[0, 100, 66, 7], [34, 56, 66, 7]] },
    { name: 'Le Goulot', s: [50, 148], h: [50, 22], walls: [[0, 100, 40, 7], [60, 100, 40, 7], [40, 56, 20, 16]] },
    { name: 'Le Coude', s: [15, 150], h: [85, 20], walls: [[30, 40, 7, 120], [63, 0, 7, 110]] },
    { name: 'Les Plots', s: [50, 150], h: [50, 18], walls: [[20, 110, 14, 14], [66, 110, 14, 14], [43, 78, 14, 14], [20, 46, 14, 14], [66, 46, 14, 14]] },
    { name: 'Le Couloir', s: [12, 150], h: [88, 150], walls: [[24, 30, 7, 130], [48, 0, 7, 130], [72, 30, 7, 130]] },
    { name: 'La Forteresse', s: [50, 150], h: [50, 45], walls: [[25, 25, 50, 6], [25, 25, 6, 45], [69, 25, 6, 45], [25, 64, 18, 6], [57, 64, 18, 6]] },
    { name: 'Le Zigzag', s: [85, 152], h: [15, 15], walls: [[30, 125, 70, 6], [0, 95, 70, 6], [30, 65, 70, 6], [0, 35, 70, 6]] },
    { name: "L'Entonnoir", s: [50, 152], h: [50, 20], walls: [[0, 90, 44, 6], [56, 90, 44, 6], [44, 70, 4, 26], [52, 70, 4, 26], [30, 40, 40, 5]] },
  ];
  let seed = (ctx.current.seed || 1) >>> 0;
  const rand = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pool = [...ALL.keys()];
  const HOLES = [0, 1, 2].map(() => ALL[pool.splice(Math.floor(rand() * pool.length), 1)[0]]);

  root.innerHTML = `
    <div class="hud"><span class="big" id="s">0 coup</span><span id="t">Trou 1/3</span></div>
    <canvas class="full" id="cv" style="background:#9fe3cf"></canvas>
    <div class="help" id="msg">Glisse vers l'arrière pour viser et doser, puis relâche. 7 coups max par trou.</div>`;
  const cv = $(root, '#cv'), msg = $(root, '#msg'), sEl = $(root, '#s'), tEl = $(root, '#t');
  const { g, W, H } = fitCanvas(cv);
  const sc = Math.min(W / 104, H / 164), ox = (W - 100 * sc) / 2, oy = (H - 160 * sc) / 2;
  const S = (x, y) => [ox + x * sc, oy + y * sc];
  const R = 2.2, HR = 3.6, A = 60, VMAX = 230;
  let hole = 0, ball = null, aim = null, total = 0, strokes = 0, sinking = false;
  function draw() {
    if (!root.isConnected) return;
    const Ho = HOLES[hole];
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#6fd3a8'; const [x0, y0] = S(0, 0); g.fillRect(x0, y0, 100 * sc, 160 * sc);
    g.strokeStyle = '#2a1638'; g.lineWidth = 4; g.strokeRect(x0, y0, 100 * sc, 160 * sc);
    g.fillStyle = '#e8456b'; for (const [x, y, w, h] of Ho.walls) { const [a, b] = S(x, y); g.fillRect(a, b, w * sc, h * sc); g.strokeRect(a, b, w * sc, h * sc); }
    const [hx, hy] = S(...Ho.h); g.fillStyle = '#2a1638'; g.beginPath(); g.arc(hx, hy, HR * sc, 0, 7); g.fill();
    g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx, hy - 26); g.stroke(); g.fillStyle = '#ffd75e'; g.beginPath(); g.moveTo(hx, hy - 26); g.lineTo(hx + 16, hy - 21); g.lineTo(hx, hy - 16); g.fill();
    if (ball) {
      const [bx, by] = S(ball.x, ball.y);
      if (aim) { const v = aimVel(); if (v) { g.strokeStyle = `hsl(${120 - v.p * 120},80%,40%)`; g.lineWidth = 3; g.setLineDash([6, 5]); g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + v.vx * sc * 0.35, by + v.vy * sc * 0.35); g.stroke(); g.setLineDash([]); } }
      g.fillStyle = '#fff'; g.strokeStyle = '#2a1638'; g.lineWidth = 2; g.beginPath(); g.arc(bx, by, Math.max(4, R * sc), 0, 7); g.fill(); g.stroke();
      if (!ball.moving && !sinking) slime(g, bx - 22, by + 4, 10, ctx.color(ctx.me));
    }
  }
  function aimVel() {
    if (!aim) return null;
    const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy, len = Math.hypot(dx, dy);
    if (len < 8) return null;
    const p = Math.min(1, len / (H * 0.35));
    return { vx: dx / len * p * VMAX, vy: dy / len * p * VMAX, p };
  }
  function collide() {
    const walls = [...HOLES[hole].walls, [-10, -10, 120, 10], [-10, 160, 120, 10], [-10, 0, 10, 160], [100, 0, 10, 160]];
    for (const [x, y, w, h] of walls) {
      const cx = Math.max(x, Math.min(ball.x, x + w)), cy = Math.max(y, Math.min(ball.y, y + h));
      const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
      if (d < R && d > 0) {
        const nx = dx / d, ny = dy / d, dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 2 * dot * nx * 0.85; ball.vy -= 2 * dot * ny * 0.85; }
        ball.x = cx + nx * R; ball.y = cy + ny * R;
      }
    }
  }
  async function roll() {
    ball.moving = true;
    let last = performance.now();
    await new Promise((res) => {
      function f(t) {
        const dt = Math.max(0, Math.min(0.05, (t - last) / 1000)); last = t;
        for (let i = 0; i < 4; i++) {
          const sdt = dt / 4, v = Math.hypot(ball.vx, ball.vy);
          if (v > 0) { const nv = Math.max(0, v - A * sdt); ball.vx *= nv / v; ball.vy *= nv / v; ball.x += ball.vx * sdt; ball.y += ball.vy * sdt; collide(); }
          const [hx, hy] = HOLES[hole].h;
          if (Math.hypot(ball.x - hx, ball.y - hy) < HR && Math.hypot(ball.vx, ball.vy) < 95) { ball.in = true; ball.x = hx; ball.y = hy; ball.vx = ball.vy = 0; }
        }
        draw();
        if (!ball.in && Math.hypot(ball.vx, ball.vy) > 0.5 && root.isConnected) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
    ball.vx = ball.vy = 0; ball.moving = false;
  }
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  for (hole = 0; hole < 3; hole++) {
    const Ho = HOLES[hole];
    ball = { x: Ho.s[0], y: Ho.s[1], vx: 0, vy: 0 }; strokes = 0;
    tEl.textContent = `Trou ${hole + 1}/3 · ${HOLES[hole].name}`;
    draw();
    if (hole === 0) await countdown(root);
    while (!ball.in && strokes < 7) {
      msg.textContent = `Coup ${strokes + 1} — glisse vers l'arrière puis relâche`;
      const v = await new Promise((res) => {
        const down = (e) => { const [x, y] = pt(e); aim = { sx: x, sy: y, cx: x, cy: y }; cv.setPointerCapture(e.pointerId); draw(); };
        const move = (e) => { if (!aim) return; const [x, y] = pt(e); aim.cx = x; aim.cy = y; draw(); };
        const up = () => { const v = aimVel(); aim = null; draw(); if (v) { cv.removeEventListener('pointerdown', down); cv.removeEventListener('pointermove', move); cv.removeEventListener('pointerup', up); res(v); } };
        cv.addEventListener('pointerdown', down); cv.addEventListener('pointermove', move); cv.addEventListener('pointerup', up);
      });
      strokes++; total++;
      sEl.textContent = total + (total > 1 ? ' coups' : ' coup');
      ball.vx = v.vx; ball.vy = v.vy;
      await roll();
    }
    if (!ball.in) { total++; sEl.textContent = total + ' coups'; msg.textContent = '⛳ 7 coups atteints : +1 de pénalité'; }
    else { sfx('ok'); } if (ball.in) msg.textContent = strokes === 1 ? '🎉 TROU EN UN !' : `⛳ Dans le trou en ${strokes} coups`;
    await sleep(1400);
  }
  ctx.finish(-total, total + ' coups');
}

// Jeux Zozz’lympiques — duels : football (air-hockey), handball (7 m), escrime

// Outils communs aux duels : adversaire, messages, forfait
function duel(ctx) {
  const pair = ctx.current.pairs.find((p) => p.a === ctx.me || p.b === ctx.me);
  const oppId = pair.a === ctx.me ? pair.b : pair.a;
  const isBot = oppId === 'BOT';
  const D = {
    pair, oppId, isBot, host: pair.a === ctx.me, firstIsMe: pair.first === ctx.me,
    oppName: isBot ? '🤖 Bot' : ctx.name(oppId), myCol: ctx.color(ctx.me), oppCol: isBot ? '#8a8fa8' : ctx.color(oppId),
    forfeit: false, onForfeit: null, handlers: [],
  };
  const inbox = [], waiters = [];
  ctx.onMsg((d) => {
    if (d.type === 'left') { D.forfeit = true; if (D.onForfeit) D.onForfeit(); while (waiters.length) waiters.shift()(); return; }
    for (const h of D.handlers) if (h(d)) return;
    inbox.push(d); while (waiters.length) waiters.shift()();
  });
  D.next = (type, r) => new Promise((res) => {
    const check = () => {
      if (D.forfeit) return res(null);
      const i = inbox.findIndex((m) => m.type === type && m.r === r);
      if (i >= 0) return res(inbox.splice(i, 1)[0]);
      waiters.push(check);
    };
    check();
  });
  return D;
}

// Choix simultané avec chrono (10 s) : renvoie [monChoix, choixAdverse]
async function simultaneousPick(ctx, D, r, buttons, allowed, timerEl, botPick) {
  buttons.forEach((b, i) => (b.disabled = !allowed.includes(i)));
  const mine = await new Promise((res) => {
    const t0 = performance.now();
    const iv = setInterval(() => { const l = 10 - (performance.now() - t0) / 1000; timerEl.textContent = Math.max(0, Math.ceil(l)) + ' s'; if (l <= 0 || D.forfeit) done(allowed[Math.floor(Math.random() * allowed.length)]); }, 200);
    const h = (e) => { e.preventDefault(); done(+e.currentTarget.dataset.v); };
    buttons.forEach((b) => b.addEventListener('pointerdown', h));
    function done(v) { clearInterval(iv); timerEl.textContent = ''; buttons.forEach((b) => { b.removeEventListener('pointerdown', h); b.disabled = true; }); res(v); }
  });
  buttons[mine]?.classList.add('picked');
  let theirs;
  if (D.isBot) { await sleep(500 + Math.random() * 700); theirs = botPick(); }
  else { ctx.send({ type: 'pick', r, v: mine }); const m = await D.next('pick', r); theirs = m ? m.v : 0; }
  buttons.forEach((b) => b.classList.remove('picked'));
  return [mine, theirs];
}

/* ---------------- Handball : tirs au but à 7 m ---------------- */
async function handball(root, ctx) {
  const D = duel(ctx);
  root.innerHTML = `
    <div class="hud"><span class="big" id="sc">0 – 0</span><span>vs ${D.oppName}</span><span id="tm"></span></div>
    <div class="split-top"><canvas id="cv"></canvas></div>
    <div class="split-bot">
